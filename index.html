<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>방사선 안전 교육용 AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Malgun Gothic', sans-serif;
            z-index: 1000;
            border: 2px solid #ffcc00;
            pointer-events: none;
        }
        .label { font-size: 14px; color: #bbb; margin-bottom: 5px; }
        .value { font-size: 26px; font-weight: bold; color: #00ff00; }
        .warning { color: #ff3333 !important; }
        #status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            margin-right: 5px;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="ui-container">
        <div class="label"><span id="status-dot"></span> <span id="source-name">마커를 찾는 중...</span></div>
        <div id="distance" class="label">거리: - m</div>
        <div id="dose-rate" class="value">0.00 mSv/hr</div>
    </div>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; 
              debugUIEnabled: false; 
              detectionMode: mono_and_matrix; 
              matrixCodeType: 3x3; 
              labelingMode: black_region; 
              canvasWidth: 640; 
              canvasHeight: 480;">
        
        <a-marker type="barcode" value="1" id="marker1">
            <a-sphere position="0 0.5 0" radius="0.1" color="red" opacity="0.6"></a-sphere>
        </a-marker>

        <a-marker type="barcode" value="2" id="marker2">
            <a-sphere position="0 0.5 0" radius="0.1" color="yellow" opacity="0.6"></a-sphere>
        </a-marker>

        <a-marker type="barcode" value="3" id="marker3">
            <a-sphere position="0 0.5 0" radius="0.1" color="green" opacity="0.6"></a-sphere>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const uiDose = document.getElementById('dose-rate');
        const uiDist = document.getElementById('distance');
        const uiName = document.getElementById('source-name');
        const uiDot = document.getElementById('status-dot');

        // 각 마커의 기준 데이터 설정
        const markerData = {
            "marker1": { i0: 10, d0: 0.5, name: "선원 #1 (고선량)" },
            "marker2": { i0: 5, d0: 0.5, name: "선원 #2 (중선량)" },
            "marker3": { i0: 3, d0: 0.5, name: "선원 #3 (저선량)" }
        };

        setInterval(() => {
            let found = false;
            
            for (let id in markerData) {
                const marker = document.getElementById(id);
                if (marker && marker.object3D.visible) {
                    found = true;
                    
                    // 거리 계산
                    let pos = marker.object3D.position;
                    let d = Math.sqrt(pos.x**2 + pos.y**2 + pos.z**2);
                    
                    // 거리 보정 (A4 21cm 기준, 실측 거리가 다르면 0.25를 조정하세요)
                    let actualDist = d * 0.25; 
                    if (actualDist < 0.1) actualDist = 0.1;

                    // 역자승 법칙 계산
                    let data = markerData[id];
                    let dose = data.i0 * Math.pow((data.d0 / actualDist), 2);

                    // UI 업데이트
                    uiName.innerText = data.name;
                    uiDist.innerText = "거리: " + actualDist.toFixed(2) + " m";
                    uiDose.innerText = dose.toFixed(2) + " mSv/hr";
                    uiDot.style.background = "#00ff00";

                    // 경고 색상
                    if (dose >= 5) {
                        uiDose.classList.add('warning');
                    } else {
                        uiDose.classList.remove('warning');
                    }
                    break; // 여러 개가 인식되어도 하나만 표시
                }
            }

            if (!found) {
                uiName.innerText = "마커를 찾는 중...";
                uiDist.innerText = "거리: - m";
                uiDot.style.background = "red";
            }
        }, 100);
    </script>
</body>
</html>
