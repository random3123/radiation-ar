<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR Pro (Direct Pointing)</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui-header { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 85%; background: rgba(0,0,0,0.85); border: 1px solid #00f2ff; padding: 15px; border-radius: 15px; color: white; text-align: center; z-index: 1000; pointer-events: none; }
        .dose-val { font-size: 32px; color: #00ff00; font-weight: bold; font-family: monospace; }
        #control-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; background: rgba(20,20,20,0.95); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        input { background: #333; color: white; border: 1px solid #555; padding: 12px; border-radius: 8px; text-align: center; font-size: 16px; }
        button { background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 999; pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00f2ff; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui-header">
        <div id="status" style="color:#00f2ff; font-size:12px;">지점을 조준하고 '측정 시작'을 누르세요</div>
        <div class="dose-val"><span id="dose-display">0.00</span> <small style="font-size:14px;">mSv/hr</small></div>
        <div id="dist-display" style="color:#ddd; font-size:14px;">거리: 0.00 m</div>
    </div>

    <div id="control-panel">
        <input type="number" id="dose-input" value="10" placeholder="기준 선량">
        <button onclick="startMeasurement()" style="background:#28a745;">측정 시작 (지점 고정)</button>
        <button onclick="location.reload()" style="background:#444;">초기화</button>
    </div>

    <!-- 순수 A-Frame 카메라만 사용 (추적 엔진 없음) -->
    <a-scene embedded renderer="antialias: true; logarithmicDepthBuffer: true;">
        <a-entity id="main-camera" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        let baseDose = 0;
        let isMeasuring = false;
        let fixedSourcePos = new THREE.Vector3(); // 고정된 가상의 선원 위치
        
        function startMeasurement() {
            baseDose = parseFloat(document.getElementById('dose-input').value);
            const cameraEl = document.getElementById('main-camera').object3D;

            // 현재 카메라 위치에서 시선 방향(앞쪽) 1.5m 지점을 3차원 공간상의 좌표로 고정
            const direction = new THREE.Vector3(0, 0, -1.5);
            direction.applyQuaternion(cameraEl.quaternion);
            fixedSourcePos.copy(cameraEl.position).add(direction);

            isMeasuring = true;
            document.getElementById('status').innerText = "측정 지점 고정됨: 앞뒤로 이동해보세요";
            document.getElementById('status').style.color = "#00ff00";
        }

        // 매 프레임 업데이트
        function updateLoop() {
            if (isMeasuring) {
                const cam = document.getElementById('main-camera').object3D;
                
                // 고정된 선원 좌표와 카메라 현재 좌표 사이의 유클리드 거리 계산
                const dist = cam.position.distanceTo(fixedSourcePos);
                
                // 역자승 법칙 적용 (0.5m 기준)
                const d0 = 0.5;
                const dose = baseDose * Math.pow((d0 / Math.max(dist, 0.01)), 2);
                
                // UI 업데이트
                document.getElementById('dose-display').innerText = dose.toFixed(2);
                document.getElementById('dist-display').innerText = `거리: ${dist.toFixed(2)} m`;
                
                // 위험 알림 색상
                document.getElementById('dose-display').style.color = dose >= 15 ? "#ff3c3c" : "#00ff00";
            }
            requestAnimationFrame(updateLoop);
        }
        updateLoop();
    </script>
</body>
</html>
