<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR 방사선 안전 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-container {
            position: absolute; top: 10px; left: 10px; right: 10px;
            z-index: 10; pointer-events: none;
            color: white; text-shadow: 1px 1px 2px black;
        }
        .info-panel {
            background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 8px;
            margin-bottom: 10px; pointer-events: auto;
        }
        input { width: 60px; padding: 5px; border-radius: 4px; border: none; }
        .warning {
            color: #ff4444; font-weight: bold; font-size: 1.2em;
            display: none; text-align: center;
        }
        /* 알람 애니메이션 */
        @keyframes flash {
            0% { background: rgba(255, 0, 0, 0); }
            50% { background: rgba(255, 0, 0, 0.5); }
            100% { background: rgba(255, 0, 0, 0); }
        }
        .alarm-active {
            animation: flash 0.5s infinite;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="info-panel">
            <div>선원 강도(D1): <input type="number" id="baseDose" value="100"> mSv/h (at 1m)</div>
            <hr>
            <div>현재 거리: <span id="distDisplay">0.00</span> m</div>
            <div>실시간 선량률: <span id="rateDisplay">0.00</span> mSv/h</div>
            <div style="font-size: 1.1em; color: #ffeb3b;">누적 선량: <span id="totalDoseDisplay">0.0000</span> mSv</div>
            <div id="alarmText" class="warning">⚠️ 경고: 누적 선량 1mSv 초과!</div>
        </div>
        <div style="text-align: center; color: #ccc; font-size: 0.8em;">
            화면을 터치하여 방사선원(빨간 구체)을 배치하세요.
        </div>
    </div>
    <div id="alarmOverlay"></div>

    <!-- Three.js 및 WebXR 라이브러리 (CDN) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let container;
        let camera, scene, renderer;
        let reticle, sourceMesh;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // 시뮬레이션 변수
        let baseDoseRate = 100; // mSv/h (at 1m)
        let accumulatedDose = 0; // mSv
        let lastTime = Date.now();
        let sourcePosition = null;
        let isAlarmActive = false;

        // 오디오 설정
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playAlarmSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // AR 시작 버튼 추가
            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // 선원 모델 (반투명 빨간 구체)
            const geometry = new THREE.SphereGeometry(0.1, 32, 32);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xff0000, 
                transparent: true, 
                opacity: 0.6 
            });
            sourceMesh = new THREE.Mesh(geometry, material);
            sourceMesh.visible = false;
            scene.add(sourceMesh);

            // 타겟(Reticle) - 바닥 인식용
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.05, 0.07, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial()
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // 화면 터치 시 선원 배치
            const controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);
            
            // 입력 바인딩
            document.getElementById('baseDose').addEventListener('input', (e) => {
                baseDoseRate = parseFloat(e.target.value) || 0;
            });
        }

        function onSelect() {
            if (reticle.visible) {
                sourcePosition = new THREE.Vector3();
                sourcePosition.setFromMatrixPosition(reticle.matrix);
                sourceMesh.position.copy(sourcePosition);
                sourceMesh.visible = true;
                
                // 오디오 컨텍스트 재개 (브라우저 보안 정책)
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Hit Test 로직
                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }

                // 선량 계산 로직
                updatePhysics();
            }

            renderer.render(scene, camera);
        }

        function updatePhysics() {
            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000; // 초 단위
            lastTime = currentTime;

            if (sourceMesh.visible) {
                // 1. 거리 측정 (카메라와 선원 사이)
                const camPos = new THREE.Vector3();
                camera.getWorldPosition(camPos);
                const distance = camPos.distanceTo(sourceMesh.position);
                
                // 최소 거리 제한 (0으로 나누기 방지 및 물리적 충돌 고려)
                const safeDist = Math.max(distance, 0.1);
                
                // 2. 거리 역자승 법칙: D2 = D1 * (1 / d^2)
                const currentRate = baseDoseRate / Math.pow(safeDist, 2);
                
                // 3. 누적 선량 계산 (mSv/h 이므로 3600으로 나눔)
                const addedDose = (currentRate / 3600) * deltaTime;
                accumulatedDose += addedDose;

                // UI 업데이트
                document.getElementById('distDisplay').innerText = distance.toFixed(2);
                document.getElementById('rateDisplay').innerText = currentRate.toFixed(2);
                document.getElementById('totalDoseDisplay').innerText = accumulatedDose.toFixed(6);

                // 4. 알람 로직 (1mSv 초과 시)
                if (accumulatedDose >= 1.0) {
                    if (!isAlarmActive) {
                        isAlarmActive = true;
                        document.getElementById('alarmOverlay').classList.add('alarm-active');
                        document.getElementById('alarmText').style.display = 'block';
                    }
                    // 주기적 비프음 (약 0.5초 간격)
                    if (Math.floor(currentTime / 500) % 2 === 0) {
                        playAlarmSound();
                    }
                }
            }
        }
    </script>
</body>
</html>
