<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR Pro - Aim & Touch</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #camera-feed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.8; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.3); }
        .hazard-glow { text-shadow: 0 0 20px rgba(239, 68, 68, 0.9); }
        
        /* 중앙 조준점 */
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            width: 40px; height: 40px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 242, 255, 0.5);
            border-radius: 50%;
            pointer-events: none; z-index: 2000;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #00f2ff;
            border-radius: 50%; transform: translate(-50%, -50%);
        }

        /* 터치 감지 레이어 (가장 위에 배치) */
        #touch-surface {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1500; cursor: pointer;
        }
    </style>
</head>
<body class="text-slate-100">

<video id="camera-feed" autoplay playsinline muted></video>
<div id="crosshair"></div>
<!-- 이 레이어가 모든 터치를 감지합니다 -->
<div id="touch-surface" onclick="handleTouch()"></div>

<!-- 상단 HUD -->
<div id="ui-header" class="fixed top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4 z-[2001] pointer-events-none">
    <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] text-cyan-400 font-bold tracking-widest uppercase">Radiation AR System v7.0</span>
        <div id="gps-status" class="flex items-center gap-1.5">
            <span id="accuracy-text" class="text-[9px] text-slate-400">GPS Initializing...</span>
            <div id="status-light" class="w-2 h-2 rounded-full bg-slate-500"></div>
        </div>
    </div>
    
    <div class="text-center py-1">
        <div id="instruction" class="text-[11px] text-amber-400 uppercase mb-1 animate-pulse font-bold">화면 중앙을 사물에 맞추고 터치하세요</div>
        <div id="dose-display" class="font-orbitron text-5xl font-bold text-green-400">0.00 <span class="text-lg font-normal">mSv/h</span></div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-700 pt-3">
        <div class="text-center">
            <div class="text-[9px] text-slate-500 uppercase">GPS Distance</div>
            <div id="dist-text" class="font-orbitron text-xl text-cyan-300">0.00 m</div>
        </div>
        <div class="text-center border-l border-slate-700">
            <div class="text-[9px] text-slate-500 uppercase">Cumulative Exposure</div>
            <div id="cum-text" class="font-orbitron text-xl text-amber-400">0.000000</div>
        </div>
    </div>
</div>

<!-- 하단 컨트롤 패널 -->
<div id="control-panel" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg z-[2002] flex flex-col gap-3">
    <div class="glass p-4 rounded-2xl shadow-2xl">
        <div class="flex flex-col gap-3">
            <div>
                <label class="text-[10px] text-slate-400 uppercase font-bold ml-1">Set Source Intensity (at 1m)</label>
                <div class="relative mt-1">
                    <input type="number" id="base-dose-input" value="100" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 px-4 text-white text-xl font-orbitron focus:ring-2 focus:ring-cyan-500 outline-none pointer-events-auto">
                    <span class="absolute right-4 top-3.5 text-slate-500 font-bold">mSv/h</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="initSensors()" class="bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold border border-slate-600 transition-all active:scale-95 pointer-events-auto">
                    <span class="text-[10px] text-cyan-400 uppercase">Step 1</span><br>활성화
                </button>
                <button onclick="resetSystem()" class="bg-rose-900/40 hover:bg-rose-800/60 border border-rose-500/50 py-4 rounded-xl font-bold text-rose-200 transition-all active:scale-95 pointer-events-auto">
                    RESET
                </button>
            </div>
        </div>
    </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-camera id="main-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-camera>

    <!-- 방사선원 엔티티 -->
    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.25" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 4;"></a-sphere>
        <a-ring radius-inner="0.6" radius-outer="0.65" rotation="-90 0 0" color="#ff0000" opacity="0.6">
             <a-animation attribute="scale" from="0.5 0.5 0.5" to="6 6 6" dur="2000" repeat="indefinite" easing="linear"></a-animation>
             <a-animation attribute="material.opacity" from="0.6" to="0" dur="2000" repeat="indefinite" easing="linear"></a-animation>
        </a-ring>
        <a-text value="RADIATION SOURCE" align="center" position="0 0.8 0" scale="1.2 1.2 1.2" color="#ff3333" font="monoid"></a-text>
    </a-entity>
</a-scene>

<script>
let targetGps = null;
let currentGps = null;
let baseDoseAt1m = 100;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let watchId = null;
let sensorActive = false;

const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

/** GPS 거리 계산 (Haversine 공식) */
function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

/** 센서 및 카메라 초기화 */
async function initSensors() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        document.getElementById('camera-feed').srcObject = stream;
        await Tone.start();

        if ("geolocation" in navigator) {
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentGps = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    document.getElementById('accuracy-text').innerText = `Acc: ±${pos.coords.accuracy.toFixed(1)}m`;
                    document.getElementById('status-light').className = "w-2 h-2 rounded-full bg-green-500";
                    sensorActive = true;
                },
                (err) => showToast("GPS Error: " + err.message),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
            showToast("System Active. Aim and Touch screen.");
        }
    } catch (err) {
        showToast("Camera access required for AR.");
    }
}

/** 화면 터치 시 실행되는 핵심 로직 */
function handleTouch() {
    if (!sensorActive || !currentGps) {
        showToast("Please 'Enable Sensors' first and wait for GPS.");
        return;
    }

    const cameraEl = document.getElementById('main-camera');
    const sourceEl = document.getElementById('radiation-source');
    
    // 카메라가 바라보는 방향으로 3미터 앞에 소스 배치
    const direction = new THREE.Vector3(0, 0, -3);
    direction.applyQuaternion(cameraEl.object3D.quaternion);
    
    const worldPos = new THREE.Vector3().copy(cameraEl.object3D.position).add(direction);
    sourceEl.object3D.position.copy(worldPos);
    sourceEl.setAttribute('visible', 'true');

    // 현재 GPS를 타겟 좌표로 저장 (배치 시점의 내 위치를 소스 위치로 간주)
    // 실제 더 정밀하게 하려면 방향 벡터를 이용해 위경도 오프셋을 계산해야 함
    targetGps = { ...currentGps };
    
    baseDoseAt1m = parseFloat(document.getElementById('base-dose-input').value) || 100;
    targetLocked = true;
    cumulativeDose = 0;
    
    document.getElementById('instruction').innerText = "소스가 조준한 위치에 고정되었습니다. 이동하세요.";
    document.getElementById('instruction').className = "text-[11px] text-cyan-400 uppercase mb-1 font-bold";
    showToast("Source Fixed at Aimed Location");
}

/** 시스템 초기화 */
function resetSystem() {
    targetLocked = false;
    targetGps = null;
    cumulativeDose = 0;
    
    document.getElementById('dose-display').innerHTML = `0.00 <span class="text-lg font-normal">mSv/h</span>`;
    document.getElementById('dose-display').className = "font-orbitron text-5xl font-bold text-green-400";
    document.getElementById('dist-text').innerText = "0.00 m";
    document.getElementById('cum-text').innerText = "0.000000";
    document.getElementById('instruction').innerText = "화면 중앙을 사물에 맞추고 터치하세요";
    document.getElementById('instruction').className = "text-[11px] text-amber-400 uppercase mb-1 animate-pulse font-bold";
    
    document.getElementById('radiation-source').setAttribute('visible', 'false');
    showToast("System Reset");
}

let nextTickTime = 0;
function update() {
    const now = performance.now();
    const dtHours = (now - lastFrameTime) / 3600000;
    lastFrameTime = now;

    if (targetLocked && currentGps && targetGps) {
        // 실제 GPS 거리 계산
        let dist = getDistanceInMeters(currentGps.lat, currentGps.lon, targetGps.lat, targetGps.lon);
        
        // 역자승 법칙 (최소 거리 0.5m 보정)
        dist = Math.max(0.5, dist);
        const currentDoseRate = baseDoseAt1m * Math.pow(1 / dist, 2);
        cumulativeDose += currentDoseRate * dtHours;

        const doseDisp = document.getElementById('dose-display');
        document.getElementById('dist-text').innerText = `${dist.toFixed(2)} m`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(6);
        doseDisp.innerHTML = `${currentDoseRate.toFixed(2)} <span class="text-lg font-normal">mSv/h</span>`;

        // 선량에 따른 UI 시각화
        if (currentDoseRate > 50) {
            doseDisp.className = "font-orbitron text-5xl font-bold text-red-500 hazard-glow animate-pulse";
        } else if (currentDoseRate > 10) {
            doseDisp.className = "font-orbitron text-5xl font-bold text-yellow-400";
        } else {
            doseDisp.className = "font-orbitron text-5xl font-bold text-green-400";
        }

        // 가이거 계수기 소리
        const tickInterval = Math.max(10, 1000 / (currentDoseRate * 0.3 + 1));
        if (now > nextTickTime) {
            synth.triggerAttackRelease("16n");
            nextTickTime = now + tickInterval;
        }

        // 3D 소스 텍스트 빌보딩
        const sourceEl = document.getElementById('radiation-source');
        sourceEl.object3D.lookAt(document.getElementById('main-camera').object3D.position);
    }
    requestAnimationFrame(update);
}

function showToast(m) {
    const t = document.createElement('div');
    t.className = "fixed bottom-44 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-6 py-2 rounded-full z-[3000] border border-cyan-500 text-xs font-bold shadow-2xl transition-all";
    t.innerText = m;
    document.body.appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 500);
    }, 2000);
}

window.onload = () => update();
</script>
</body>
</html>
