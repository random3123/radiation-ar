<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Camera Fixed</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* 카메라 비디오 레이어 */
        #video-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; /* 가장 뒤에 배치 */
        }

        /* 메인 UI */
        #ui-header { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 85%; background: rgba(0,0,0,0.8); border: 1px solid #00f2ff; padding: 15px; border-radius: 15px; color: white; text-align: center; z-index: 1000; }
        .dose-val { font-size: 32px; color: #00ff00; font-weight: bold; }
        
        /* 하단 조작부 */
        #control-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; background: rgba(20,20,20,0.9); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        input { background: #333; color: white; border: 1px solid #555; padding: 12px; border-radius: 8px; text-align: center; font-size: 16px; }
        button { padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
        #btn-start { background: #28a745; color: white; }
        #btn-cam { background: #007bff; color: white; }

        /* 에러 로그 표시 (디버깅용) */
        #log { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,0,0,0.7); color: white; font-size: 10px; z-index: 2000; display: none; }
        
        #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 999; pointer-events: none; }
    </style>
</head>
<body>
    <div id="log"></div>
    <video id="video-background" autoplay playsinline muted></video>
    <div id="crosshair"></div>

    <div id="ui-header">
        <div id="status">먼저 [카메라 켜기]를 누르세요</div>
        <div class="dose-val"><span id="dose-display">0.00</span> <small>mSv/hr</small></div>
        <div id="dist-display" style="font-size:14px; color:#ccc;">거리: 0.00 m</div>
    </div>

    <div id="control-panel">
        <input type="number" id="dose-input" value="10" placeholder="기준 선량">
        <button id="btn-cam" onclick="initCamera()">1. 카메라 켜기</button>
        <button id="btn-start" onclick="startMeasurement()">2. 측정 시작 (사물 조준)</button>
        <button onclick="location.reload()" style="background:#444; color:white;">초기화</button>
    </div>

    <!-- A-Frame Scene (거리 계산 전용) -->
    <a-scene embedded vr-mode-ui="enabled: false" style="background: transparent;">
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera look-controls wasd-controls></a-entity>
        </a-entity>
    </a-scene>

    <script>
        let baseDose = 0;
        let isMeasuring = false;
        let fixedSourcePos = new THREE.Vector3();
        const video = document.getElementById('video-background');

        function debugLog(msg) {
            const logDiv = document.getElementById('log');
            logDiv.style.display = 'block';
            logDiv.innerText += msg + "\n";
        }

        // 1. 카메라 강제 활성화
        async function initCamera() {
            try {
                const constraints = {
                    video: { facingMode: 'environment' },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // 센서 권한 요청 (iOS 전용)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if(permission !== 'granted') alert("센서 권한이 거부되었습니다.");
                }

                document.getElementById('status').innerText = "카메라 연결됨. 사물을 조준하세요.";
                document.getElementById('btn-cam').style.display = 'none';
                debugLog("Camera initialized successfully.");
            } catch (err) {
                debugLog("Error: " + err.name + " - " + err.message);
                alert("카메라를 켤 수 없습니다. HTTPS 연결과 권한을 확인하세요.");
            }
        }

        // 2. 측정 시작 (현재 조준 지점 좌표 고정)
        function startMeasurement() {
            baseDose = parseFloat(document.getElementById('dose-input').value);
            const cameraEl = document.getElementById('main-camera').object3D;

            // 카메라 앞 1.5미터 지점을 가상의 '사물 위치'로 고정
            const vector = new THREE.Vector3(0, 0, -1.5);
            vector.applyQuaternion(cameraEl.quaternion);
            fixedSourcePos.copy(cameraEl.position).add(vector);

            isMeasuring = true;
            document.getElementById('status').innerText = "측정 중: 이제 앞뒤로 이동하세요";
            document.getElementById('status').style.color = "#00f2ff";
        }

        // 3. 실시간 거리 및 선량 계산 루프
        function update() {
            if (isMeasuring) {
                const camPos = document.getElementById('main-camera').object3D.position;
                
                // 고정된 사물 좌표와 현재 내 카메라 사이의 거리 계산
                const dist = camPos.distanceTo(fixedSourcePos);
                
                // 역자승 법칙 (기준거리 0.5m)
                const d0 = 0.5;
                const dose = baseDose * Math.pow((d0 / Math.max(dist, 0.1)), 2);
                
                document.getElementById('dose-display').innerText = dose.toFixed(2);
                document.getElementById('dist-display').innerText = `거리: ${dist.toFixed(2)} m`;
                
                // 선량에 따른 색상 변경
                document.getElementById('dose-display').style.color = dose > 15 ? "#ff3c3c" : "#00ff00";
            }
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
