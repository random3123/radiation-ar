<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Hybrid Shielding Lab</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .hazard-glow { text-shadow: 0 0 20px rgba(239, 68, 68, 1); }
        
        #crosshair { position: fixed; top: 50%; left: 50%; width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; display: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }

        /* A-Frame 기본 AR/VR 진입 사각버튼 화면에서 완전히 숨기기 */
        .a-enter-vr, .a-enter-ar, .a-enter-ar-button, .a-enter-vr-button { display: none !important; }

        /* 경고 발생 시 무한 깜빡임 애니메이션 추가 */
        @keyframes pulse-danger {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }
        .infinite-danger-flash {
            animation: pulse-danger 0.8s infinite;
        }
    </style>
</head>
<body>

<div id="intro-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center px-6" style="background: url('background5.png') center/cover no-repeat;">
    
    <div class="w-full max-w-sm flex flex-col items-center translate-y-[150px]">
        
        <div class="bg-white/85 backdrop-blur-md p-6 rounded-xl border border-white/60 mb-[16px] text-center shadow-[0_8px_30px_rgba(0,0,0,0.15)] w-full">
            <label class="text-[13px] text-slate-700 uppercase font-extrabold block mb-3">실습 기준 선량 (1m 거리 기준)</label>
            <div class="flex items-center justify-center gap-2">
                <input type="number" id="base-dose-input" value="20" class="w-28 bg-white border-2 border-blue-200 rounded-lg py-3 px-2 text-slate-800 text-center font-orbitron text-2xl focus:border-blue-500 outline-none shadow-inner transition-colors">
                <span class="text-slate-700 font-bold">mSv/h</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-4 font-semibold">선원은 스마트폰 정면 <span class="text-blue-600 font-extrabold">2m 앞</span>에 생성됩니다.</p>
        </div>

        <button id="start-ar-btn" class="bg-green-600 hover:bg-green-500 px-8 py-4 rounded-2xl font-bold text-lg shadow-[0_0_20px_rgba(22,163,74,0.5)] transition-all active:scale-95 w-full text-white border border-green-400/50">
            실습 시작 (카메라 켜기)
        </button>
        
    </div>
</div>

<div id="ui-overlay" class="absolute inset-0 z-50 hidden" style="pointer-events: none;">
    
    <div id="crosshair"></div>

    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4">
        <div class="flex justify-between items-center mb-1">
            <span id="status-msg" class="text-[12px] text-amber-400 font-bold animate-pulse">원하는 위치를 조준하고 배치하세요</span>
            <span id="rad-type-badge" class="text-[10px] bg-red-600 px-2 py-1 rounded text-white font-bold uppercase"></span>
        </div>
        
        <div class="text-center py-1">
            <div id="dose-display" class="font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter">0.00</div>
            <div class="text-lg text-green-400 font-bold mt-1">mSv/h</div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-700/50 pt-3">
            <div class="text-center">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">선원과의 물리적 거리</div>
                <div id="dist-text" class="font-orbitron text-3xl text-sky-300">0.00 <span class="text-sm">m</span></div>
            </div>
            <div class="text-center border-l border-slate-700/50">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">누적 피폭량</div>
                <div id="cum-text" class="font-orbitron text-3xl text-amber-400">0.0000</div>
            </div>
        </div>
    </div>

    <div id="manual-controls" class="absolute right-4 top-1/2 -translate-y-1/2 flex-col gap-3 pointer-events-auto hidden">
        <div class="glass p-3 rounded-2xl flex flex-col items-center gap-3 border border-sky-500/30">
            <span class="text-[10px] text-sky-300 font-bold tracking-widest text-center">가상<br>이동</span>
            <button onclick="moveSource(-0.5)" class="w-14 h-14 bg-rose-600 rounded-full text-white font-bold active:scale-90 transition-all shadow-[0_0_15px_rgba(225,29,72,0.6)] text-[11px] leading-tight flex flex-col items-center justify-center">
                접근
            </button>
            <button onclick="moveSource(0.5)" class="w-14 h-14 bg-sky-600 rounded-full text-white font-bold active:scale-90 transition-all shadow-[0_0_15px_rgba(2,132,199,0.6)] text-[11px] leading-tight flex flex-col items-center justify-center">
                후퇴
            </button>
        </div>
    </div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg pointer-events-auto flex flex-col gap-2">
        <div id="shield-controls" class="flex-col gap-2 hidden w-full">
            <div class="flex gap-2 w-full">
                <select id="live-rad-type" class="flex-1 bg-slate-800 text-amber-400 p-3 rounded-xl border border-slate-600 font-bold outline-none text-[13px] text-center">
                    <option value="alpha">알파선 (α)</option>
                    <option value="beta">베타선 (β)</option>
                    <option value="gamma" selected>감마선 (γ)</option>
                </select>
                <select id="shield-type" class="flex-1 bg-slate-800 text-sky-300 p-3 rounded-xl border border-slate-600 font-bold outline-none text-[13px] text-center">
                    <option value="none">차폐체 없음</option>
                    <option value="paper">종이 (Paper)</option>
                    <option value="plastic">플라스틱 (Lego)</option>
                    <option value="lead">납 (Lead)</option>
                </select>
            </div>
            <button id="shield-btn" class="w-full bg-indigo-600 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[13px] uppercase transition-all">
                🛡️ 선택한 차폐체를 1m 앞에 설치/변경
            </button>
        </div>

        <div class="flex gap-2 w-full">
            <button id="place-btn" class="w-full bg-amber-600 py-4 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[14px] uppercase transition-all border border-amber-400/50">
                📍 조준점 2m 앞에 선원 고정
            </button>
            <button id="reset-btn" class="w-full bg-slate-700 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[13px] uppercase transition-all hidden">
                초기화
            </button>
        </div>
    </div>
</div>

<a-scene 
    webxr="optionalFeatures: dom-overlay; overlayElement: #ui-overlay"
    vr-mode-ui="enabled: true"
    renderer="alpha: true; antialias: true">
    
    <a-assets>
        <img id="paper-texture" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><rect width='256' height='256' fill='white'/><path d='M 40 0 V 256' stroke='%23ef4444' stroke-width='2'/><path d='M 0 32 H 256 M 0 64 H 256 M 0 96 H 256 M 0 128 H 256 M 0 160 H 256 M 0 192 H 256 M 0 224 H 256' stroke='%233b82f6' stroke-width='1.5'/></svg>" crossorigin="anonymous">
        
        <img id="lego-texture" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128'><rect width='128' height='128' fill='%2316a34a'/><pattern id='stud' width='32' height='32' patternUnits='userSpaceOnUse'><circle cx='16' cy='16' r='10' fill='%2315803d'/><circle cx='15' cy='15' r='8' fill='%2322c55e'/></pattern><rect width='128' height='128' fill='url(%23stud)'/></svg>" crossorigin="anonymous">
        
        <img id="lead-texture" src="lead1.png" crossorigin="anonymous">
    </a-assets>

    <a-camera id="main-camera" position="0 1.6 0"></a-camera>

    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.1" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 3"
                  animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 500">
        </a-sphere>
        <a-text id="source-label" value="" align="center" position="0 0.35 0" color="#ff4444" scale="0.6 0.6 0.6"></a-text>
        <a-ring radius-inner="0.13" radius-outer="0.17" color="#ff0000" material="opacity: 0.8; side: double"
                animation__scale="property: scale; from: 1 1 1; to: 5 5 5; loop: true; dur: 1500; easing: linear"
                animation__opacity="property: material.opacity; from: 0.8; to: 0; loop: true; dur: 1500; easing: linear">
        </a-ring>
    </a-entity>

    <a-entity id="shield-object" visible="false">
        <a-box id="shield-box" width="0.5" height="0.7" depth="0.2" color="#ffffff" material="opacity: 0.95; transparent: true"></a-box>
        <a-text id="shield-label" value="SHIELD" align="center" position="0 0 0.11" color="#ffffff" scale="0.35 0.35 0.35"></a-text>
    </a-entity>
</a-scene>

<script>
// --- 전역 변수 ---
let targetLocked = false;
let baseDoseAt1m = 20; 
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let sourcePosition = new THREE.Vector3();
let nextTickTime = 0;
let alarmTriggered = false;
let alarmIntervalId = null;

// 차폐 관련 변수
let shieldActive = false;
let shieldMaterial = 'none';
let shieldPosition = new THREE.Vector3();

// 물리적 투과율 데이터
const shieldingData = {
    alpha: { none: 1.0, paper: 0.00, plastic: 0.00, lead: 0.00 },
    beta:  { none: 1.0, paper: 1.00, plastic: 0.00, lead: 0.00 },
    gamma: { none: 1.0, paper: 1.00, plastic: 1.00, lead: 0.10 }  
};

// 가이거 계수기 타격음
const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

// 알람 사운드
const alarmSynth = new Tone.Synth({
    oscillator: { type: 'square' },
    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
}).toDestination();
alarmSynth.volume.value = -5;

const sceneEl = document.querySelector('a-scene');

document.getElementById('start-ar-btn').addEventListener('click', async () => {
    try {
        await Tone.start();
        baseDoseAt1m = parseFloat(document.getElementById('base-dose-input').value) || 20; 
        
        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';
        lastFrameTime = performance.now();
        
        const enterARBtn = document.querySelector('.a-enter-ar-button');
        if (enterARBtn) { enterARBtn.click(); } 
    } catch (e) { console.error(e); }
});

sceneEl.addEventListener('exit-vr', () => {
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('ui-overlay').style.display = 'none';
    resetSystem();
});

document.getElementById('place-btn').addEventListener('click', () => {
    const camera = document.getElementById('main-camera').object3D;
    sourcePosition.set(0, 0, -2);
    camera.localToWorld(sourcePosition);
    document.getElementById('radiation-source').setAttribute('position', `${sourcePosition.x} ${sourcePosition.y} ${sourcePosition.z}`);
    document.getElementById('radiation-source').setAttribute('visible', 'true');
    
    document.getElementById('source-label').setAttribute('value', `${baseDoseAt1m} mSv/h`);
    
    targetLocked = true;
    document.getElementById('place-btn').classList.add('hidden');
    document.getElementById('reset-btn').classList.remove('hidden');
    document.getElementById('shield-controls').classList.remove('hidden');
    document.getElementById('shield-controls').classList.add('flex');
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('manual-controls').style.display = 'flex';
});

document.getElementById('live-rad-type').addEventListener('change', (e) => {
    const types = { alpha: "알파선(α)", beta: "베타선(β)", gamma: "감마선(γ)" };
    showToast(`방사선이 [ ${types[e.target.value]} ] 으로 변경되었습니다.`, 2000);
});

document.getElementById('shield-type').addEventListener('change', () => {
    if(shieldActive || document.getElementById('shield-type').value !== 'none') {
        document.getElementById('shield-btn').click();
    }
});

// 차폐체 설치/변경 로직
document.getElementById('shield-btn').addEventListener('click', () => {
    shieldMaterial = document.getElementById('shield-type').value;
    const sObj = document.getElementById('shield-object');
    
    const sBox = document.getElementById('shield-box');
    const sLabel = document.getElementById('shield-label');
    
    if(shieldMaterial === 'none') {
        shieldActive = false;
        sObj.setAttribute('visible', 'false');
        return;
    }
    
    const camera = document.getElementById('main-camera').object3D;
    shieldPosition.set(0, 0, -1);
    camera.localToWorld(shieldPosition);
    sObj.setAttribute('position', `${shieldPosition.x} ${shieldPosition.y} ${shieldPosition.z}`);
    sObj.setAttribute('visible', 'true');
    shieldActive = true;
    
    // 기본 플레이트 박스와 라벨 텍스트 활성화 통일
    sBox.setAttribute('visible', 'true');
    sLabel.setAttribute('visible', 'true');
    
    if(shieldMaterial === 'paper') { 
        sBox.setAttribute('depth', '0.1'); 
        sBox.removeAttribute('material'); 
        sBox.setAttribute('material', 'src: #paper-texture; repeat: 1 3; opacity: 0.95; transparent: true; color: #ffffff;');
        sLabel.setAttribute('value', 'PAPER'); 
        sLabel.setAttribute('color', '#1e293b'); 
        sLabel.setAttribute('position', '0 0 0.055'); 
        
    } else if(shieldMaterial === 'plastic') { 
        sBox.setAttribute('depth', '0.2'); 
        sBox.removeAttribute('material');
        sBox.setAttribute('material', 'src: #lego-texture; repeat: 4 6; opacity: 1.0; transparent: false; color: #ffffff;');
        sLabel.setAttribute('value', 'PLASTIC (LEGO)'); 
        sLabel.setAttribute('color', '#ffffff');
        sLabel.setAttribute('position', '0 0 0.11'); 
        
    } else if(shieldMaterial === 'lead') { 
        // 외부에서 불러온 lead1.png 파일 매핑 및 입체감(두께) 제거
        sBox.setAttribute('depth', '0'); 
        sBox.removeAttribute('material');
        sBox.setAttribute('material', 'src: #lead-texture; opacity: 1.0; transparent: false; color: #ffffff;');
        sLabel.setAttribute('value', 'LEAD (납)'); 
        sLabel.setAttribute('color', '#ffffff');
        sLabel.setAttribute('position', '0 0 0.02'); 
    }
    
    sObj.object3D.lookAt(camera.position); 
});

function moveSource(deltaDistance) {
    if (!targetLocked) return;
    let currentCamPos = new THREE.Vector3();
    document.getElementById('main-camera').object3D.getWorldPosition(currentCamPos);
    let direction = new THREE.Vector3().subVectors(sourcePosition, currentCamPos).normalize();
    sourcePosition.add(direction.multiplyScalar(deltaDistance));
    if (currentCamPos.distanceTo(sourcePosition) < 0.1) {
        direction.normalize(); 
        sourcePosition.copy(currentCamPos).add(direction.multiplyScalar(0.1));
    }
    document.getElementById('radiation-source').setAttribute('position', `${sourcePosition.x} ${sourcePosition.y} ${sourcePosition.z}`);
}

function resetSystem() { 
    if(alarmIntervalId) clearInterval(alarmIntervalId);
    location.reload(); 
}
document.getElementById('reset-btn').addEventListener('click', resetSystem);

function stopDangerAlarm() {
    if(alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
    }
    const flashEl = document.getElementById('danger-flash-screen');
    if(flashEl) flashEl.remove();
    
    const popupEl = document.getElementById('danger-popup-window');
    if(popupEl) popupEl.remove();

    showMoveInstructionPopup("⚠️ 작업중지\n저선량지역 이동");
}

function update() {
    if (targetLocked) {
        const now = performance.now();
        const dtHours = (now - lastFrameTime) / 3600000;
        lastFrameTime = now;

        let currentCamPos = new THREE.Vector3();
        document.getElementById('main-camera').object3D.getWorldPosition(currentCamPos);
        let dist = Math.max(0.1, currentCamPos.distanceTo(sourcePosition));
        let currentDoseRate = baseDoseAt1m * Math.pow(1.0 / dist, 2);

        if (shieldActive) {
            let currentRadType = document.getElementById('live-rad-type').value;
            let camToShield = currentCamPos.distanceTo(shieldPosition);
            let camToSource = currentCamPos.distanceTo(sourcePosition);
            let sourceToShield = sourcePosition.distanceTo(shieldPosition);
            
            if (camToShield < camToSource && sourceToShield < camToSource) {
                currentDoseRate *= shieldingData[currentRadType][shieldMaterial]; 
            }
        }

        cumulativeDose += currentDoseRate * dtHours;
        const doseDisp = document.getElementById('dose-display');
        doseDisp.innerText = currentDoseRate.toFixed(2);
        document.getElementById('dist-text').innerHTML = `${dist.toFixed(2)} <span class="text-sm">m</span>`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(4);

        if (cumulativeDose >= 0.1 && !alarmTriggered) {
            alarmTriggered = true; 
            
            alarmIntervalId = setInterval(() => {
                const t = Tone.now();
                alarmSynth.triggerAttackRelease("C6", "16n", t);
                alarmSynth.triggerAttackRelease("C6", "16n", t + 0.2);
                alarmSynth.triggerAttackRelease("C6", "16n", t + 0.4);
                alarmSynth.triggerAttackRelease("C6", "16n", t + 0.6);
            }, 800);
            
            const flash = document.createElement('div');
            flash.id = 'danger-flash-screen';
            flash.className = "fixed inset-0 bg-red-600 z-[2000] pointer-events-none transition-all infinite-danger-flash";
            document.body.appendChild(flash);

            showDangerPopup("🚨 위험: 누적 피폭량이 0.1 mSv를 초과했습니다!");
        }

        if (currentDoseRate > baseDoseAt1m * 1.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-red-500 hazard-glow leading-none tracking-tighter";
        } else if (currentDoseRate > baseDoseAt1m * 0.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-yellow-400 leading-none tracking-tighter";
        } else if (currentDoseRate === 0) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-slate-500 leading-none tracking-tighter";
        } else {
            doseDisp.className = "font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter";
        }

        const tickInterval = Math.max(20, 1000 / (currentDoseRate * 0.5 + 1));
        if (now > nextTickTime && currentDoseRate > 0) {
            synth.triggerAttackRelease("32n");
            nextTickTime = now + tickInterval;
        }

        document.getElementById('radiation-source').object3D.lookAt(currentCamPos);
    }
    requestAnimationFrame(update);
}

function showToast(msg, duration = 2000) {
    const t = document.createElement('div');
    t.className = "fixed top-[30%] left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-6 py-3 rounded-xl z-[3000] border border-sky-500 text-[13px] font-bold shadow-[0_0_20px_rgba(0,0,0,0.8)] transition-all duration-300 pointer-events-none text-center whitespace-nowrap";
    t.innerText = msg;
    document.getElementById('ui-overlay').appendChild(t);
    
    if (duration !== null) {
        setTimeout(() => {
            t.style.opacity = '0';
            setTimeout(() => t.remove(), 500);
        }, duration);
    }
}

function showDangerPopup(msg) {
    const p = document.createElement('div');
    p.id = "danger-popup-window";
    
    p.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-950/95 text-white p-8 rounded-2xl z-[3005] border-4 border-red-500 shadow-[0_0_40px_rgba(239,68,68,0.8)] transition-all duration-300 pointer-events-auto text-center flex flex-col items-center justify-center gap-6 w-[85%] max-w-md";
    
    const textSpan = document.createElement('div');
    textSpan.className = "text-2xl font-black text-red-400 leading-normal tracking-tight break-keep";
    textSpan.innerText = msg;
    p.appendChild(textSpan);
    
    const stopBtn = document.createElement('button');
    stopBtn.className = "w-full bg-red-600 hover:bg-red-500 text-white font-extrabold py-3 px-2 rounded-xl text-md md:text-lg shadow-lg active:scale-95 transition-all border border-red-400/50 uppercase cursor-pointer whitespace-nowrap overflow-hidden text-center";
    stopBtn.innerText = "🚨 알람 정지 (경고 끄기)";
    
    stopBtn.onclick = function() {
        stopDangerAlarm();
    };
    
    p.appendChild(stopBtn);
    document.getElementById('ui-overlay').appendChild(p);
}

function showMoveInstructionPopup(msg) {
    const p = document.createElement('div');
    p.id = "move-instruction-window";
    p.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 text-white p-8 rounded-2xl z-[3010] border-4 border-amber-500 shadow-[0_0_40px_rgba(245,158,11,0.7)] transition-all duration-300 pointer-events-auto text-center flex flex-col items-center justify-center gap-6 w-[85%] max-w-md";
    
    const textSpan = document.createElement('div');
    textSpan.className = "text-2xl font-black text-amber-400 leading-relaxed tracking-wide whitespace-pre-line";
    textSpan.innerText = msg;
    p.appendChild(textSpan);
    
    const closeBtn = document.createElement('button');
    closeBtn.className = "w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold py-3 rounded-xl text-lg shadow-lg active:scale-95 transition-all border border-amber-400/50 cursor-pointer";
    closeBtn.innerText = "확인";
    
    closeBtn.onclick = function() {
        p.remove();
    };
    
    p.appendChild(closeBtn);
    document.getElementById('ui-overlay').appendChild(p);
}

update();
</script>
</body>
</html>
