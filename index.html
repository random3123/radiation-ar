<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>방사선 선량 시뮬레이터</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
        #ui-layer { position: fixed; top: 10px; width: 100%; text-align: center; color: white; font-family: sans-serif; pointer-events: none; }
        #control-panel { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; 
            color: white; text-align: center; z-index: 1000;
        }
        button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui-layer">
        <div id="status-msg" style="background: rgba(0,0,0,0.5); padding: 5px;">지점을 터치하여 선원을 배치하세요</div>
        <div style="font-size: 24px; margin-top: 10px;">선량: <span id="dose-val">0.00</span> mSv/hr</div>
        <div id="dist-val">거리: - m</div>
    </div>

    <div id="control-panel">
        <div>선원 세기(mSv/hr): <input type="number" id="dose-input" value="10" style="width: 60px;"></div>
        <button id="apply-btn" onclick="applySettings()">적용하기</button>
        <button onclick="resetApp()">초기화</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-entity id="source" visible="false">
            <a-sphere radius="0.15" color="yellow"></a-sphere>
        </a-entity>
        <a-entity camera position="0 1.6 0" look-controls></a-entity>
        <a-sky id="touch-area" color="#ECECEC" opacity="0"></a-sky>
    </a-scene>

    <script>
        const source = document.getElementById('source');
        const statusMsg = document.getElementById('status-msg');
        const doseVal = document.getElementById('dose-val');
        const distVal = document.getElementById('dist-val');
        const doseInput = document.getElementById('dose-input');
        
        let targetPosition = null;
        let baseDose = 0;
        let isApplied = false;

        // 1. 지점 터치 (배치)
        document.getElementById('touch-area').addEventListener('click', function() {
            if(isApplied) return;
            
            // 카메라 앞 2m 지점에 배치
            const cam = document.querySelector('a-entity[camera]').object3D;
            const pos = new THREE.Vector3(0, 0, -2).applyQuaternion(cam.quaternion).add(cam.position);
            
            source.setAttribute('position', pos);
            source.setAttribute('visible', 'true');
            targetPosition = pos;
            statusMsg.innerText = "지점 선택 완료! 값을 설정 후 '적용하기'를 누르세요.";
        });

        // 2. 적용하기 버튼
        function applySettings() {
            if(!targetPosition) {
                alert("먼저 화면을 터치해 지점을 배치해주세요!");
                return;
            }
            baseDose = parseFloat(doseInput.value);
            isApplied = true;
            statusMsg.innerText = "적용 완료! 거리에 따라 선량이 변합니다.";
            statusMsg.style.background = "rgba(0, 200, 0, 0.7)";
        }

        function resetApp() {
            source.setAttribute('visible', 'false');
            isApplied = false;
            targetPosition = null;
            doseVal.innerText = "0.00";
            distVal.innerText = "거리: - m";
            statusMsg.innerText = "지점을 터치하여 선원을 배치하세요";
            statusMsg.style.background = "rgba(0,0,0,0.5)";
        }

        // 3. 거리 계산 루프
        function update() {
            if (isApplied && targetPosition) {
                const cam = document.querySelector('a-entity[camera]').object3D;
                const dist = cam.position.distanceTo(targetPosition);
                
                // 역자승 법칙: I = I0 * (d0/d)^2 (기준거리 d0=0.5m)
                const d0 = 0.5;
                const dose = (dist < 0.2) ? baseDose : baseDose * Math.pow((d0 / dist), 2);
                
                doseVal.innerText = dose.toFixed(2);
                distVal.innerText = "거리: " + dist.toFixed(2) + " m";
            }
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
