<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Camera Fix</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: black; font-family: sans-serif; }
        
        /* 실시간 카메라 배경 */
        #camera-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }

        /* 에러 로그 표시창 (카메라가 안 켜질 때 원인 확인용) */
        #debug-log {
            position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,0,0,0.8);
            color: white; font-size: 12px; z-index: 2000; padding: 5px; display: none;
        }

        #ui-header {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(0,0,0,0.8); border: 1px solid #00f2ff;
            border-radius: 12px; padding: 12px; color: white; text-align: center; z-index: 1001;
        }
        .main-dose { font-size: 32px; font-weight: bold; color: #00ff00; }
        
        #control-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(20,20,20,0.9); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 1002;
        }
        button { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div id="debug-log"></div>
<video id="camera-video" autoplay playsinline muted></video>

<div id="ui-header">
    <div id="status">1. 카메라/센서 허용 필수</div>
    <div class="main-dose"><span id="dose-rate">0.00</span> mSv/hr</div>
    <div id="distance">거리: 0.00 m</div>
</div>

<div id="control-panel">
    <input type="number" id="base-dose-input" value="10" style="padding:10px; text-align:center;">
    <button id="btn-init" onclick="initCameraAndSensors()" style="background:#007bff;">1. 카메라 & 센서 켜기</button>
    <button id="btn-lock" onclick="lockTargetInSpace()" style="background:#28a745; display:none;">2. 현재 위치에 타겟 고정</button>
    <button onclick="location.reload()" style="background:#444;">초기화</button>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
    <a-entity id="main-camera" camera look-controls position="0 1.6 0"></a-entity>
    
    <a-sphere id="target-marker" radius="0.15" color="red" visible="false"
              material="emissive: red; emissiveIntensity: 2;"></a-sphere>
</a-scene>

<script>
let fixedSourcePos = new THREE.Vector3();
let baseDoseRate = 0;
let targetLocked = false;

function logError(msg) {
    const logEl = document.getElementById('debug-log');
    logEl.style.display = 'block';
    logEl.innerText = "Error: " + msg;
}

// 1. 카메라 및 센서 초기화 (사용자 클릭으로 실행)
async function initCameraAndSensors() {
    try {
        // 카메라 권한 요청
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' }, 
            audio: false 
        });
        document.getElementById('camera-video').srcObject = stream;

        // 센서 권한 요청 (iOS 13+ 필수)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') throw new Error("센서 권한이 거부되었습니다.");
        }

        document.getElementById('status').innerText = "카메라 활성화됨. 타겟을 지정하세요.";
        document.getElementById('btn-init').style.display = 'none';
        document.getElementById('btn-lock').style.display = 'block';

    } catch (err) {
        logError(err.name + ": " + err.message);
        alert("카메라를 켤 수 없습니다. HTTPS 환경인지, 권한을 허용했는지 확인하세요.");
    }
}

// 2. 타겟 고정 (공간 좌표에 박아버림)
function lockTargetInSpace() {
    baseDoseRate = parseFloat(document.getElementById('base-dose-input').value) || 0;
    const camera = document.getElementById('main-camera').object3D;
    
    // 현재 카메라의 위치와 정면 방향(2m 앞)으로 선원 좌표 설정
    const forward = new THREE.Vector3(0, 0, -2);
    forward.applyQuaternion(camera.quaternion);
    fixedSourcePos.copy(camera.position).add(forward);

    const marker = document.getElementById('target-marker');
    marker.object3D.position.copy(fixedSourcePos);
    marker.setAttribute('visible', true);

    targetLocked = true;
    document.getElementById('status').innerText = "타겟 고정됨. 뒤로 물러나 보세요.";
}

// 3. 거리 계산 루프
function update() {
    if (targetLocked) {
        const camera = document.getElementById('main-camera').object3D;
        
        // 카메라와 고정된 선원 사이의 거리 측정
        const dist = camera.position.distanceTo(fixedSourcePos);
        
        // 역자승 법칙 적용 (기준거리 0.5m)
        const d0 = 0.5;
        const currentDoseRate = baseDoseRate * Math.pow(d0 / Math.max(dist, 0.1), 2);

        document.getElementById('dose-rate').innerText = currentDoseRate.toFixed(2);
        document.getElementById('distance').innerText = `거리: ${dist.toFixed(2)} m`;
        document.getElementById('dose-rate').style.color = currentDoseRate > 15 ? "#ff3c3c" : "#00ff00";
    }
    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
