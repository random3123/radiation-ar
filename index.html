# Radiation AR - WebXR Hit Test Wall Target Version

```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Real Surface Target</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-ar-hit-test-component/dist/aframe-ar-hit-test-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: sans-serif;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
        }

        #ui-header {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0,0,0,0.82);
            border: 1px solid #00f2ff;
            border-radius: 14px;
            padding: 14px;
            color: white;
            text-align: center;
            z-index: 1001;
        }

        .main-dose {
            font-size: 30px;
            font-weight: bold;
            color: #00ff00;
        }

        #control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(20,20,20,0.92);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1002;
        }

        input, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        input {
            background: #333;
            color: white;
            text-align: center;
        }

        button {
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div id="ui-header">
    <div id="status">1. AR 시작 → 2. 벽면/평면 조준 → 3. 타겟 지정</div>
    <div class="main-dose"><span id="dose-rate">0.00</span> mSv/hr</div>
    <div id="distance">거리: 0.00 m</div>
    <div id="target-dose">기준 선량: 0.00 mSv/hr</div>
    <div id="cumulative-dose">누적 피폭량: 0.000000 mSv</div>
</div>

<div id="control-panel">
    <input type="number" id="base-dose-input" value="10" step="0.1" min="0">
    <button onclick="startAR()" style="background:#007bff;">1. AR 시작</button>
    <button onclick="lockTarget()" style="background:#28a745;">2. 실제 표면 타겟 지정</button>
    <button onclick="location.reload()" style="background:#444;">초기화</button>
</div>

<a-scene
    renderer="alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay; overlayElement: body;"
    ar-hit-test="target:#cursor"
>
    <a-camera id="main-camera" position="0 1.6 0" look-controls></a-camera>

    <!-- 실시간 표면 탐지 커서 -->
    <a-entity id="cursor"
              geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.08"
              material="color: cyan; shader: flat"
              rotation="-90 0 0"
              visible="false">
    </a-entity>

    <!-- 고정 방사선 타겟 -->
    <a-sphere id="target-marker"
              radius="0.25"
              color="red"
              visible="false"
              material="shader: standard; emissive: red; emissiveIntensity: 2;">
    </a-sphere>

    <!-- 선량 표시 -->
    <a-entity id="dose-label"
              visible="false"
              text="value: ; color: white; align: center; width: 6; side: double;">
    </a-entity>

</a-scene>

<script>
let fixedSourcePos = new THREE.Vector3();
let baseDoseRate = 0;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let measurementStartTime = null;

function startAR() {
    const scene = document.querySelector('a-scene');

    if (!navigator.xr) {
        alert('이 기기는 WebXR AR을 지원하지 않습니다.');
        return;
    }

    scene.enterVR()
        .then(() => {
            document.getElementById('status').innerText = 'AR 시작됨. 실제 벽면/평면을 조준하세요.';
        })
        .catch(err => {
            alert('AR 시작 실패: HTTPS 또는 WebXR 지원 여부 확인 필요');
            console.error(err);
        });
}

function lockTarget() {
    const cursor = document.getElementById('cursor');

    if (!cursor.object3D.visible) {
        alert('평면이 감지되지 않았습니다. 벽/바닥을 다시 조준하세요.');
        return;
    }

    baseDoseRate = parseFloat(document.getElementById('base-dose-input').value) || 0;

    // 실제 감지된 평면 위치 고정
    fixedSourcePos.copy(cursor.object3D.position);

    const marker = document.getElementById('target-marker');
    marker.object3D.position.copy(fixedSourcePos);
    marker.setAttribute('visible', true);

    const label = document.getElementById('dose-label');
    label.object3D.position.copy(
        fixedSourcePos.clone().add(new THREE.Vector3(0, 0.35, 0))
    );
    label.setAttribute(
        'text',
        `value: ${baseDoseRate.toFixed(1)} mSv/hr; color: white; align: center; width: 6; side: double;`
    );
    label.setAttribute('visible', true);

    cumulativeDose = 0;
    lastFrameTime = performance.now();
    measurementStartTime = performance.now();
    targetLocked = true;

    document.getElementById('target-dose').innerText = `기준 선량: ${baseDoseRate.toFixed(2)} mSv/hr`;
    document.getElementById('status').innerText = '타겟 고정 완료. 이동하며 거리/선량 측정 중';
}

function update() {
    if (targetLocked) {
        const camera = document.getElementById('main-camera').object3D;
        const label = document.getElementById('dose-label');

        const now = performance.now();
        const dtHours = (now - lastFrameTime) / 3600000;
        lastFrameTime = now;

        // 실제 거리 계산
        let dist = camera.position.distanceTo(fixedSourcePos);
        dist = Math.max(0.5, Math.min(dist, 10));

        // 기준 거리 0.5m
        const referenceDistance = 0.5;
        const currentDoseRate = baseDoseRate * Math.pow(referenceDistance / dist, 2);

        cumulativeDose += currentDoseRate * dtHours;

        document.getElementById('dose-rate').innerText = currentDoseRate.toFixed(2);
        document.getElementById('distance').innerText = `거리: ${dist.toFixed(2)} m`;
        document.getElementById('cumulative-dose').innerText = `누적 피폭량: ${cumulativeDose.toFixed(6)} mSv`;

        // 라벨 카메라 정면 유지
        label.object3D.lookAt(camera.position);

        // 색상 경고
        const doseEl = document.getElementById('dose-rate');
        if (currentDoseRate > 15) {
            doseEl.style.color = '#ff3c3c';
        } else if (currentDoseRate > 5) {
            doseEl.style.color = '#ffaa00';
        } else {
            doseEl.style.color = '#00ff00';
        }
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
```
