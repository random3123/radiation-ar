<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - True Walking Tracker</title>
    <!-- A-Frame (WebXR 지원 프레임워크) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .hazard-glow { text-shadow: 0 0 20px rgba(239, 68, 68, 1); }
        
        /* 중앙 조준점 (AR 모드일 때만 보임) */
        #crosshair { position: fixed; top: 50%; left: 50%; width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; display: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }

        /* A-Frame 기본 진입 버튼 숨김 (커스텀 버튼 사용) */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

<!-- 1. 앱 시작 인트로 화면 -->
<div id="intro-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900 px-6">
    <div class="w-20 h-20 bg-sky-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(14,165,233,0.6)]">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
    </div>
    <h1 class="text-3xl font-orbitron font-bold text-white mb-2 text-center">AR 방사선 실습계측기</h1>
    <p class="text-sky-400 font-bold mb-8 text-center text-sm">실제 도보 이동 추적 (WebXR)</p>
    
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 mb-8 max-w-sm text-center shadow-xl w-full">
        <label class="text-[11px] text-slate-400 uppercase font-bold block mb-2">실습 기준 선량 (1m 거리 기준)</label>
        <div class="flex items-center justify-center gap-2">
            <input type="number" id="base-dose-input" value="100" class="w-24 bg-slate-900 border border-slate-600 rounded-lg py-2 px-2 text-white text-center font-orbitron text-xl focus:border-sky-500 outline-none">
            <span class="text-slate-400 font-bold">mSv/h</span>
        </div>
        <p class="text-slate-400 text-[10px] mt-3">선원은 스마트폰 정면 <span class="text-amber-400 font-bold">3m 앞</span>에 생성됩니다.</p>
    </div>

    <button id="start-ar-btn" class="bg-green-600 hover:bg-green-500 px-8 py-4 rounded-2xl font-bold text-lg shadow-[0_0_20px_rgba(22,163,74,0.5)] transition-all active:scale-95 w-full max-w-sm text-white">
        실습 시작 (카메라 켜기)
    </button>
    
    <p class="text-amber-500/80 text-[11px] mt-6 font-bold text-center">
        ※ 주의: 안드로이드 기기 및 크롬(Chrome) 브라우저 권장<br>(스마트폰의 공간 인식 센서를 직접 사용합니다)
    </p>
</div>

<!-- 2. AR 실행 중 UI 오버레이 -->
<div id="ui-overlay" class="absolute inset-0 z-50 hidden" style="pointer-events: none;">
    
    <!-- 조준점 -->
    <div id="crosshair"></div>

    <!-- 상단 HUD -->
    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4">
        <div class="flex justify-between items-center mb-1">
            <span id="status-msg" class="text-[12px] text-amber-400 font-bold animate-pulse">원하는 위치를 조준하고 배치하세요</span>
        </div>
        
        <div class="text-center py-1">
            <div id="dose-display" class="font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter">0.00</div>
            <div class="text-lg text-green-400 font-bold mt-1">mSv/h</div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-700/50 pt-3">
            <div class="text-center">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">선원과의 물리적 거리</div>
                <div id="dist-text" class="font-orbitron text-3xl text-sky-300">0.00 <span class="text-sm">m</span></div>
            </div>
            <div class="text-center border-l border-slate-700/50">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">누적 피폭량</div>
                <div id="cum-text" class="font-orbitron text-3xl text-amber-400">0.0000</div>
            </div>
        </div>
    </div>

    <!-- 하단 컨트롤 버튼 -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg pointer-events-auto flex gap-3">
        <button id="place-btn" class="flex-1 bg-rose-600 py-4 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[14px] uppercase transition-all border border-rose-400/50">
            📍 조준점 3m 앞에 선원 고정
        </button>
        <button id="reset-btn" class="bg-slate-700 px-6 py-4 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[14px] uppercase transition-all hidden">
            초기화
        </button>
    </div>
</div>

<!-- 3. WebXR AR 공간 환경 설정 -->
<a-scene 
    webxr="optionalFeatures: dom-overlay; overlayElement: #ui-overlay"
    vr-mode-ui="enabled: true"
    renderer="alpha: true; antialias: true">
    
    <a-camera id="main-camera" position="0 1.6 0"></a-camera>

    <!-- 배치될 방사선원 -->
    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.1" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 3"
                  animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 500">
        </a-sphere>
        <a-text id="source-label" value="SOURCE" align="center" position="0 0.35 0" color="#ff4444" scale="0.6 0.6 0.6"></a-text>
        <a-ring radius-inner="0.13" radius-outer="0.17" color="#ff0000" material="opacity: 0.8; side: double"
                animation__scale="property: scale; from: 1 1 1; to: 5 5 5; loop: true; dur: 1500; easing: linear"
                animation__opacity="property: material.opacity; from: 0.8; to: 0; loop: true; dur: 1500; easing: linear">
        </a-ring>
    </a-entity>
</a-scene>

<script>
let targetLocked = false;
let baseDoseAt1m = 100;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let sourcePosition = new THREE.Vector3();

const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

const sceneEl = document.querySelector('a-scene');

document.getElementById('start-ar-btn').addEventListener('click', async () => {
    try {
        await Tone.start();
        baseDoseAt1m = parseFloat(document.getElementById('base-dose-input').value) || 100;
        
        const enterARBtn = document.querySelector('.a-enter-ar-button');
        if (enterARBtn) {
            enterARBtn.click();
        } else {
            alert("기기 또는 브라우저가 공간 인식(WebXR)을 지원하지 않습니다. 최신 안드로이드 스마트폰의 크롬 브라우저를 사용해주세요.");
        }
    } catch (e) {
        console.error(e);
    }
});

sceneEl.addEventListener('enter-vr', () => {
    if (sceneEl.is('ar-mode')) {
        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';
        lastFrameTime = performance.now();
    }
});

sceneEl.addEventListener('exit-vr', () => {
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('ui-overlay').style.display = 'none';
    resetSystem();
});

// --- 2. 선원을 3m 앞에 배치 ---
document.getElementById('place-btn').addEventListener('click', () => {
    const camera = document.getElementById('main-camera').object3D;
    const sourceEl = document.getElementById('radiation-source');

    // ★ 카메라 렌즈 기준 앞쪽 3m (0, 0, -3) 을 3D 월드 좌표로 변환
    sourcePosition.set(0, 0, -3);
    camera.localToWorld(sourcePosition);
    
    // AR 씬에 렌더링
    sourceEl.setAttribute('position', `${sourcePosition.x} ${sourcePosition.y} ${sourcePosition.z}`);
    sourceEl.setAttribute('visible', 'true');

    targetLocked = true;
    cumulativeDose = 0;
    
    document.getElementById('place-btn').classList.add('hidden');
    document.getElementById('reset-btn').classList.remove('hidden');
    document.getElementById('crosshair').style.display = 'none';
    
    const statusMsg = document.getElementById('status-msg');
    statusMsg.innerText = "3m 앞에 배치 완료! 천천히 다가가며 선량을 확인하세요.";
    statusMsg.className = "text-[12px] text-sky-400 font-bold";
});

function resetSystem() {
    targetLocked = false;
    cumulativeDose = 0;
    document.getElementById('radiation-source').setAttribute('visible', 'false');
    
    document.getElementById('place-btn').classList.remove('hidden');
    document.getElementById('reset-btn').classList.add('hidden');
    document.getElementById('crosshair').style.display = 'block';
    
    const doseDisp = document.getElementById('dose-display');
    doseDisp.innerText = "0.00";
    doseDisp.className = "font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter";
    document.getElementById('dist-text').innerHTML = `0.00 <span class="text-sm">m</span>`;
    document.getElementById('cum-text').innerText = "0.0000";
    
    const statusMsg = document.getElementById('status-msg');
    statusMsg.innerText = "원하는 위치를 조준하고 배치하세요";
    statusMsg.className = "text-[12px] text-amber-400 font-bold animate-pulse";
}
document.getElementById('reset-btn').addEventListener('click', resetSystem);

let nextTickTime = 0;
function update() {
    if (targetLocked && sceneEl.is('ar-mode')) {
        const now = performance.now();
        const dtHours = (now - lastFrameTime) / 3600000;
        lastFrameTime = now;

        let currentCamPos = new THREE.Vector3();
        document.getElementById('main-camera').object3D.getWorldPosition(currentCamPos);
        
        let dist = currentCamPos.distanceTo(sourcePosition);
        
        // 거리가 3m에 가까우면 수치를 깔끔하게 3.0으로 보정 (배치 직후 오차 제거)
        if (Math.abs(dist - 3.0) < 0.1) dist = 3.0;
        // 최소 0.1m 이하로는 수치가 무한대로 튀는 것을 방지
        dist = Math.max(0.1, dist);

        // 역자승 법칙 적용 (1m 거리 기준값 사용)
        const currentDoseRate = baseDoseAt1m * Math.pow(1.0 / dist, 2);
        cumulativeDose += currentDoseRate * dtHours;

        document.getElementById('source-label').setAttribute('value', `SOURCE\n${currentDoseRate.toFixed(1)} mSv/h`);
        
        const doseDisp = document.getElementById('dose-display');
        document.getElementById('dist-text').innerHTML = `${dist.toFixed(2)} <span class="text-sm">m</span>`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(4);
        doseDisp.innerText = currentDoseRate.toFixed(2);

        // 색상 경고 로직 (위험수치는 기준 선량 대비)
        if (currentDoseRate > baseDoseAt1m * 1.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-red-500 hazard-glow leading-none tracking-tighter";
        } else if (currentDoseRate > baseDoseAt1m * 0.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-yellow-400 leading-none tracking-tighter";
        } else {
            doseDisp.className = "font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter";
        }

        // 가이거 사운드 출력
        const tickInterval = Math.max(20, 1000 / (currentDoseRate * 0.5 + 1));
        if (now > nextTickTime) {
            synth.triggerAttackRelease("32n");
            nextTickTime = now + tickInterval;
        }

        // 구체가 항상 사용자를 쳐다봄
        document.getElementById('radiation-source').object3D.lookAt(currentCamPos);
    }
    
    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
