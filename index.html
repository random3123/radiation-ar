# Radiation AR - WebXR/DeviceMotion Improved Version

```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Improved Motion Tracking</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;

            background: #000;

        }
    </style>

<body>

<div id="log"></div>
<div id="crosshair"></div>

<div id="ui-header">
    <div id="status">먼저 [카메라/센서 시작] 버튼을 누르세요</div>
    <div class="dose-val">
        <span id="dose-display">0.00</span> <small>mSv/hr</small>
    </div>
    <div id="dist-display" style="font-size:14px; color:#ccc;">거리: 0.00 m</div>
</div>

<div id="control-panel">
    <input type="number" id="dose-input" value="10" placeholder="기준 선량 (0.5m 기준)">
    <button id="btn-cam" onclick="initSensors()">1. 카메라/센서 시작</button>
    <button id="btn-start" onclick="startMeasurement()">2. 측정 시작 (사물 조준)</button>
    <button onclick="location.reload()" style="background:#444; color:white;">초기화</button>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
>
    <a-entity id="rig" position="0 1.6 0">
        <a-camera id="main-camera" gps-camera rotation-reader></a-camera>
    </a-entity>

    <a-sphere id="target-marker"
        radius="0.08"
        color="#ff0000"
        visible="false">
    </a-sphere>
</a-scene>

<script>
let baseDose = 10;
let isMeasuring = false;
let fixedSourcePos = new THREE.Vector3();
let estimatedUserPos = new THREE.Vector3(0, 1.6, 0);
let velocity = new THREE.Vector3(0, 0, 0);
let lastMotionTime = null;
let motionActive = false;

function debugLog(msg) {
    const logDiv = document.getElementById('log');
    logDiv.style.display = 'block';
    logDiv.innerText += msg + "\n";
}

async function initSensors() {
    try {
        // iOS motion permission
        if (
            typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function'
        ) {
            const motionPerm = await DeviceMotionEvent.requestPermission();
            if (motionPerm !== 'granted') {
                alert('모션 센서 권한이 필요합니다.');
                return;
            }
        }

        if (
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
            await DeviceOrientationEvent.requestPermission();
        }

        window.addEventListener('devicemotion', handleMotion, true);
        motionActive = true;

        document.getElementById('status').innerText = '센서 활성화 완료. 사물을 조준하세요.';
        document.getElementById('btn-cam').style.display = 'none';
    } catch (err) {
        debugLog(err.message);
        alert('센서 초기화 실패');
    }
}

function handleMotion(event) {
    if (!motionActive) return;

    const acc = event.accelerationIncludingGravity;
    if (!acc) return;

    const now = performance.now();
    if (!lastMotionTime) {
        lastMotionTime = now;
        return;
    }

    const dt = (now - lastMotionTime) / 1000;
    lastMotionTime = now;

    if (dt > 0.2) return;

    const cameraObj = document.getElementById('main-camera').object3D;

    // 중력/노이즈 완화용 threshold
    const threshold = 0.15;

    let localAcc = new THREE.Vector3(
        Math.abs(acc.x) < threshold ? 0 : acc.x,
        Math.abs(acc.y) < threshold ? 0 : acc.y,
        Math.abs(acc.z) < threshold ? 0 : acc.z
    );

    // 기기 방향 기준 -> 월드 좌표 변환
    localAcc.applyQuaternion(cameraObj.quaternion);

    // 속도 적분
    velocity.add(localAcc.multiplyScalar(dt));

    // 감쇠 (드리프트 완화)
    velocity.multiplyScalar(0.92);

    // 위치 적분
    estimatedUserPos.add(velocity.clone().multiplyScalar(dt));

    cameraObj.position.copy(estimatedUserPos);
}

function startMeasurement() {
    baseDose = parseFloat(document.getElementById('dose-input').value) || 10;

    const cameraObj = document.getElementById('main-camera').object3D;

    // 현재 조준 방향 기준 2m 전방 고정
    const forward = new THREE.Vector3(0, 0, -2.0);
    forward.applyQuaternion(cameraObj.quaternion);

    fixedSourcePos.copy(cameraObj.position).add(forward);

    const marker = document.getElementById('target-marker');
    marker.object3D.position.copy(fixedSourcePos);
    marker.setAttribute('visible', true);

    isMeasuring = true;

    document.getElementById('status').innerText = '측정 중: 실제로 앞뒤/좌우 이동하세요';
    document.getElementById('status').style.color = '#00f2ff';
}

function updateDose() {
    if (isMeasuring) {
        const camPos = document.getElementById('main-camera').object3D.position;

        const dist = camPos.distanceTo(fixedSourcePos);

        const referenceDistance = 0.5;
        const safeDist = Math.max(dist, 0.15);

        const dose = baseDose * Math.pow(referenceDistance / safeDist, 2);

        const doseEl = document.getElementById('dose-display');
        doseEl.innerText = dose.toFixed(2);

        document.getElementById('dist-display').innerText = `거리: ${dist.toFixed(2)} m`;

        if (dose > 15) {
            doseEl.style.color = '#ff3c3c';
        } else if (dose > 5) {
            doseEl.style.color = '#ffaa00';
        } else {
            doseEl.style.color = '#00ff00';
        }
    }

    requestAnimationFrame(updateDose);
}

updateDose();
</script>

</body>
</html>
