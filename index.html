<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Touch & Track Fixed</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        #camera-feed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.7;
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .hazard-glow {
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
        }

        /* 실제 화면 터치 감지 레이어 */
        #touch-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            cursor: crosshair;
            background: transparent;
        }

        /* UI 버튼과 입력창은 터치가 가능해야 하므로 touch-layer보다 위에 둠 */
        #ui-header,
        #control-panel {
            z-index: 1001;
        }

        #control-panel,
        #control-panel * {
            pointer-events: auto;
        }

        #ui-header {
            pointer-events: none;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>

<body class="text-slate-100">

<video id="camera-feed" autoplay playsinline muted></video>

<!-- 화면 전체 터치 감지용 레이어 -->
<div id="touch-layer"></div>

<!-- 메인 HUD -->
<div id="ui-header" class="fixed top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4 pointer-events-none">
    <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] text-sky-400 font-bold tracking-widest uppercase">Radiation Touch Tracker v6.1</span>
        <div id="gps-status" class="flex items-center gap-1.5">
            <span id="accuracy-text" class="text-[9px] text-slate-400">GPS Initializing...</span>
            <div id="status-light" class="w-2 h-2 rounded-full bg-slate-500"></div>
        </div>
    </div>

    <div class="text-center py-1">
        <div id="instruction" class="text-[11px] text-amber-400 uppercase mb-1 animate-pulse">Step 1: Enable Sensors를 누른 뒤 화면을 터치하세요</div>
        <div id="dose-display" class="font-orbitron text-5xl font-bold text-green-400">0.00 <span class="text-lg font-normal">mSv/h</span></div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-700 pt-3">
        <div class="text-center">
            <div class="text-[9px] text-slate-500 uppercase">Distance</div>
            <div id="dist-text" class="font-orbitron text-xl text-sky-300">0.00 m</div>
        </div>
        <div class="text-center border-l border-slate-700">
            <div class="text-[9px] text-slate-500 uppercase">Cumulative Exposure</div>
            <div id="cum-text" class="font-orbitron text-xl text-amber-400">0.000000</div>
        </div>
    </div>
</div>

<!-- 하단 컨트롤 패널 -->
<div id="control-panel" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg flex flex-col gap-3">
    <div class="glass p-4 rounded-2xl shadow-2xl">
        <div class="flex flex-col gap-3">
            <div>
                <label class="text-[10px] text-slate-400 uppercase font-bold ml-1">Source Intensity at 1m</label>
                <div class="relative mt-1">
                    <input type="number" id="base-dose-input" value="50" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 px-4 text-white text-xl font-orbitron focus:ring-2 focus:ring-sky-500 outline-none">
                    <span class="absolute right-4 top-3.5 text-slate-500 font-bold">mSv/h</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="initSensors()" class="bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold flex flex-col items-center justify-center border border-slate-600 transition-all active:scale-95">
                    <span class="text-[10px] text-sky-400 uppercase">Step 1</span>
                    <span>Enable Sensors</span>
                </button>

                <button type="button" onclick="resetSystem()" class="bg-rose-900/40 hover:bg-rose-800/60 border border-rose-500/50 py-4 rounded-xl font-bold text-rose-200 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    RESET
                </button>
            </div>
        </div>
    </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;">
    <a-camera id="main-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-camera>

    <a-entity id="radiation-source" visible="false" position="0 1.6 -3">
        <a-sphere radius="0.25" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 3;">
            <a-animation attribute="scale" from="1 1 1" to="1.4 1.4 1.4" dur="600" direction="alternate" repeat="indefinite"></a-animation>
        </a-sphere>

        <a-ring radius-inner="0.6" radius-outer="0.65" rotation="-90 0 0" color="#ff0000" opacity="0.6">
            <a-animation attribute="scale" from="0.5 0.5 0.5" to="5 5 5" dur="1500" repeat="indefinite" easing="linear"></a-animation>
            <a-animation attribute="material.opacity" from="0.6" to="0" dur="1500" repeat="indefinite" easing="linear"></a-animation>
        </a-ring>

        <a-text value="RADIATION SOURCE" align="center" position="0 0.8 0" scale="1.5 1.5 1.5" color="#ff3333"></a-text>
    </a-entity>
</a-scene>

<script>
let targetGps = null;
let currentGps = null;
let baseDoseAt1m = 50;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let watchId = null;
let sensorsReady = false;
let nextTickTime = 0;

const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaPhi = (lat2 - lat1) * Math.PI / 180;
    const deltaLambda = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
        Math.cos(phi1) * Math.cos(phi2) *
        Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);

    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

async function initSensors() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
        });

        document.getElementById('camera-feed').srcObject = stream;
        await Tone.start();
        sensorsReady = true;

        document.getElementById('instruction').innerText = '카메라 활성화 완료. GPS 수신 후 화면을 터치하세요.';
        document.getElementById('instruction').className = 'text-[11px] text-sky-400 uppercase mb-1';

        if ('geolocation' in navigator) {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentGps = {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    };

                    document.getElementById('accuracy-text').innerText = `Acc: ±${pos.coords.accuracy.toFixed(1)}m`;
                    document.getElementById('status-light').className = 'w-2 h-2 rounded-full bg-green-500';
                    document.getElementById('instruction').innerText = '화면을 터치하면 방사선원이 배치됩니다.';
                    document.getElementById('instruction').className = 'text-[11px] text-amber-400 uppercase mb-1 animate-pulse';
                },
                (err) => {
                    document.getElementById('accuracy-text').innerText = 'GPS Error';
                    document.getElementById('status-light').className = 'w-2 h-2 rounded-full bg-red-500';
                    showToast('GPS Error: ' + err.message);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        } else {
            showToast('This device does not support GPS.');
        }

        showToast('Sensors Active');
    } catch (err) {
        sensorsReady = false;
        showToast('Camera Permission Denied or Unavailable');
    }
}

function placeRadiationSource(event) {
    // UI 패널을 누른 경우에는 방사선원을 배치하지 않음
    if (event.target.closest && event.target.closest('#control-panel')) {
        return;
    }

    if (!sensorsReady) {
        showToast('먼저 Enable Sensors를 누르세요.');
        return;
    }

    if (!currentGps) {
        showToast('Waiting for GPS signal...');
        return;
    }

    const camera = document.getElementById('main-camera');
    const sourceEl = document.getElementById('radiation-source');

    const direction = new THREE.Vector3();
    const cameraPos = new THREE.Vector3();

    camera.object3D.getWorldDirection(direction);
    camera.object3D.getWorldPosition(cameraPos);

    // 카메라가 바라보는 방향으로 3m 앞에 배치
    const sourceDistance = 3;
    const sourcePos = cameraPos.clone().add(direction.multiplyScalar(sourceDistance));

    sourceEl.object3D.position.copy(sourcePos);
    sourceEl.setAttribute('visible', 'true');

    // GPS 좌표는 현재 위치에서 카메라 정면 3m 앞에 있는 것으로 근사
    // x: 동서 방향, z: 남북 방향 근사값
    const latOffset = sourcePos.z / 111320;
    const lonOffset = sourcePos.x / (111320 * Math.cos(currentGps.lat * Math.PI / 180));

    targetGps = {
        lat: currentGps.lat - latOffset,
        lon: currentGps.lon + lonOffset
    };

    baseDoseAt1m = parseFloat(document.getElementById('base-dose-input').value) || 50;
    targetLocked = true;
    cumulativeDose = 0;
    lastFrameTime = performance.now();

    document.getElementById('instruction').innerText = '소스가 배치되었습니다. 거리를 조절하며 측정하세요.';
    document.getElementById('instruction').className = 'text-[11px] text-sky-400 uppercase mb-1';

    showToast('Radiation Source Placed');
}

// 모바일 터치와 PC 클릭 둘 다 지원
const touchLayer = document.getElementById('touch-layer');
touchLayer.addEventListener('click', placeRadiationSource);
touchLayer.addEventListener('touchend', function(event) {
    event.preventDefault();
    placeRadiationSource(event);
}, { passive: false });

function resetSystem() {
    targetLocked = false;
    targetGps = null;
    cumulativeDose = 0;
    nextTickTime = 0;

    document.getElementById('dose-display').innerHTML = '0.00 <span class="text-lg font-normal">mSv/h</span>';
    document.getElementById('dose-display').className = 'font-orbitron text-5xl font-bold text-green-400';
    document.getElementById('dist-text').innerText = '0.00 m';
    document.getElementById('cum-text').innerText = '0.000000';

    if (sensorsReady) {
        document.getElementById('instruction').innerText = '화면을 터치하면 방사선원이 배치됩니다.';
        document.getElementById('instruction').className = 'text-[11px] text-amber-400 uppercase mb-1 animate-pulse';
    } else {
        document.getElementById('instruction').innerText = 'Step 1: Enable Sensors를 누른 뒤 화면을 터치하세요';
        document.getElementById('instruction').className = 'text-[11px] text-amber-400 uppercase mb-1 animate-pulse';
    }

    document.getElementById('radiation-source').setAttribute('visible', 'false');
    showToast('System Reset Complete');
}

function update() {
    const now = performance.now();
    const dtHours = (now - lastFrameTime) / 3600000;
    lastFrameTime = now;

    if (targetLocked && currentGps && targetGps) {
        let dist = getDistanceInMeters(currentGps.lat, currentGps.lon, targetGps.lat, targetGps.lon);

        // GPS 오차와 0m 폭주 방지를 위한 최소 거리 보정
        dist = Math.max(0.5, dist);

        // 역자승 법칙 적용: 선량률 ∝ 1 / 거리²
        const currentDoseRate = baseDoseAt1m * Math.pow(1 / dist, 2);
        cumulativeDose += currentDoseRate * dtHours;

        const doseDisp = document.getElementById('dose-display');
        document.getElementById('dist-text').innerText = `${dist.toFixed(2)} m`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(6);
        doseDisp.innerHTML = `${currentDoseRate.toFixed(2)} <span class="text-lg font-normal">mSv/h</span>`;

        if (currentDoseRate > 100) {
            doseDisp.className = 'font-orbitron text-5xl font-bold text-red-500 hazard-glow animate-pulse';
        } else if (currentDoseRate > 20) {
            doseDisp.className = 'font-orbitron text-5xl font-bold text-yellow-400';
        } else {
            doseDisp.className = 'font-orbitron text-5xl font-bold text-green-400';
        }

        // 가이거 계수기 효과음: 선량률이 높을수록 빠르게 발생
        const tickInterval = Math.max(15, 1000 / (currentDoseRate * 0.4 + 1));
        if (now > nextTickTime) {
            synth.triggerAttackRelease('16n');
            nextTickTime = now + tickInterval;
        }

        // 텍스트가 카메라를 향하도록 처리
        const sourceEl = document.getElementById('radiation-source');
        const camera = document.getElementById('main-camera');
        sourceEl.object3D.lookAt(camera.object3D.position);
    }

    requestAnimationFrame(update);
}

function showToast(message) {
    const t = document.createElement('div');
    t.className = 'fixed bottom-44 left-1/2 -translate-x-1/2 bg-sky-950/90 text-white px-5 py-2.5 rounded-full z-[3000] border border-sky-500 text-xs font-bold shadow-2xl transition-all';
    t.innerText = message;
    document.body.appendChild(t);

    setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 500);
    }, 2500);
}

window.onload = () => {
    update();
};
</script>
</body>
</html>
