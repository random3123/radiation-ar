<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Hybrid Shielding Lab</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* 투명한 글래스 UI 설정 유지 */
        .glass { 
            background: rgba(15, 23, 42, 0.2); 
            backdrop-filter: blur(2px); 
            border: 1px solid rgba(56, 189, 248, 0.4); 
            box-shadow: 0 0 20px rgba(0,0,0,0.3); 
        }

        /* 밝은 톤의 글씨가 카메라(밝은 배경)에서도 무조건 잘 보이도록 진한 다크 그림자(Outline) 효과 적용 */
        .ar-text {
            text-shadow: 0 0 4px rgba(0, 0, 0, 1), 0 0 8px rgba(0, 0, 0, 0.8);
        }
        
        .hazard-glow { text-shadow: 0 0 15px rgba(239, 68, 68, 1), 0 0 4px black, 0 0 8px black !important; }
        
        #crosshair { position: fixed; top: 50%; left: 50%; width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; display: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }

        /* A-Frame 기본 AR/VR 진입 사각버튼 숨기기 */
        .a-enter-vr, .a-enter-ar, .a-enter-ar-button, .a-enter-vr-button { display: none !important; }

        /* 무한 깜빡임 애니메이션 */
        @keyframes pulse-danger {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }
        .infinite-danger-flash {
            animation: pulse-danger 0.8s infinite;
        }
    </style>
</head>
<body>

<!-- 배경 이미지가 잘리지 않도록 contain 속성을 추가하고 상단 여백을 조정했습니다. -->
<div id="intro-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center px-6" style="background: url('background6.png') center top/contain no-repeat; background-color: #0f172a;">
    
    <div class="w-full max-w-sm flex flex-col items-center translate-y-[100px]">
        <div class="bg-white/85 backdrop-blur-md p-6 rounded-xl border border-white/60 mb-[16px] text-center shadow-[0_8px_30px_rgba(0,0,0,0.15)] w-full">
            <label class="text-[13px] text-slate-700 uppercase font-extrabold block mb-3">실습 기준 선량 (1m 거리 기준)</label>
            <div class="flex items-center justify-center gap-2">
                <input type="number" id="base-dose-input" value="20" class="w-28 bg-white border-2 border-blue-200 rounded-lg py-3 px-2 text-slate-800 text-center font-orbitron text-2xl focus:border-blue-500 outline-none shadow-inner transition-colors">
                <span class="text-slate-700 font-bold">mSv/h</span>
            </div>
            <!-- 요청하신 안내 문구 삭제됨 -->
        </div>

        <button id="start-ar-btn" class="bg-green-600 hover:bg-green-500 px-8 py-4 rounded-2xl font-bold text-lg shadow-[0_0_20px_rgba(22,163,74,0.5)] transition-all active:scale-95 w-full text-white border border-green-400/50">
            실습 시작 (카메라 켜기)
        </button>
    </div>
</div>

<div id="ui-overlay" class="absolute inset-0 z-50 hidden" style="pointer-events: none;">
    
    <div id="crosshair"></div>

    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4">
        <div class="flex justify-between items-center mb-1">
            <span id="status-msg" class="text-[12px] text-amber-400 font-extrabold animate-pulse ar-text">원하는 위치를 조준하고 배치하세요</span>
            <span id="rad-type-badge" class="text-[10px] bg-red-600 px-2 py-1 rounded text-white font-bold uppercase border border-red-800"></span>
        </div>
        
        <div class="text-center py-1 flex flex-col items-center">
            <div class="text-[13px] text-slate-200 uppercase font-extrabold tracking-tighter mb-1 ar-text whitespace-nowrap">시간당 방사선량</div>
            <div class="flex justify-center items-baseline gap-2">
                <div id="dose-display" class="font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter ar-text">0.00</div>
                <div class="text-xl text-green-400 font-extrabold ar-text">mSv/h</div>
            </div>
        </div>

        <div class="grid grid-cols-[40%_60%] gap-2 mt-3 border-t border-slate-700/50 pt-3">
            <div class="text-center">
                <div class="text-[13px] text-slate-200 uppercase font-extrabold tracking-tighter mb-1 ar-text whitespace-nowrap">선원과의 거리</div>
                <div id="dist-text" class="font-orbitron text-3xl text-sky-300 font-bold ar-text whitespace-nowrap">0.00 <span class="text-sm">m</span></div>
            </div>
            <div class="text-center border-l border-slate-700/50">
                <div class="text-[13px] text-slate-200 uppercase font-extrabold tracking-tighter mb-1 ar-text whitespace-nowrap">누적 피폭량</div>
                <div id="cum-text" class="font-orbitron text-3xl text-amber-400 font-bold ar-text tracking-tighter whitespace-nowrap">0.000 <span class="text-sm">mSv</span></div>
            </div>
        </div>
    </div>

    <div id="manual-controls" class="absolute right-4 top-1/2 -translate-y-1/2 flex-col gap-3 pointer-events-auto hidden">
        <div class="glass p-3 rounded-2xl flex flex-col items-center gap-3 border border-sky-500/30">
            <span class="text-[13px] text-sky-300 font-extrabold tracking-widest text-center ar-text">가상<br>이동</span>
            <button onclick="moveSource(-0.5)" class="w-14 h-14 bg-rose-600 rounded-full text-white font-bold active:scale-90 transition-all shadow-[0_0_15px_rgba(225,29,72,0.6)] text-[11px] leading-tight flex flex-col items-center justify-center border border-rose-800">
                접근
            </button>
            <button onclick="moveSource(0.5)" class="w-14 h-14 bg-sky-600 rounded-full text-white font-bold active:scale-90 transition-all shadow-[0_0_15px_rgba(2,132,199,0.6)] text-[11px] leading-tight flex flex-col items-center justify-center border border-sky-800">
                후퇴
            </button>
        </div>
    </div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg pointer-events-auto flex flex-col gap-2">
        <div id="shield-controls" class="flex-col gap-2 hidden w-full">
            <div class="flex gap-2 w-full">
                <select id="live-rad-type" class="flex-1 bg-slate-800 text-amber-400 p-3 rounded-xl border border-slate-600 font-bold outline-none text-[13px] text-center">
                    <option value="alpha">알파선 (α)</option>
                    <option value="beta">베타선 (β)</option>
                    <option value="gamma" selected>감마선 (γ)</option>
                </select>
                <select id="shield-type" class="flex-1 bg-slate-800 text-sky-300 p-3 rounded-xl border border-slate-600 font-bold outline-none text-[13px] text-center">
                    <option value="none">차폐체 없음</option>
                    <option value="paper">종이 (Paper)</option>
                    <option value="plastic">플라스틱 (Lego)</option>
                    <option value="lead">납 (Lead)</option>
                </select>
            </div>
        </div>

        <div class="flex gap-2 w-full">
            <!-- 요청하신 버튼 문구 변경됨 -->
            <button id="place-btn" class="w-full bg-amber-600 py-4 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[14px] transition-all border border-amber-400/50">
                측정 시작
            </button>
            <button id="reset-btn" class="w-full bg-slate-700 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 text-[13px] uppercase transition-all hidden">
                초기화
            </button>
        </div>
    </div>
</div>

<a-scene 
    webxr="optionalFeatures: dom-overlay; overlayElement: #ui-overlay"
    vr-mode-ui="enabled: true"
    renderer="alpha: true; antialias: true">
    
    <a-assets>
        <img id="paper-texture" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><rect width='256' height='256' fill='white'/><path d='M 40 0 V 256' stroke='%23ef4444' stroke-width='2'/><path d='M 0 32 H 256 M 0 64 H 256 M 0 96 H 256 M 0 128 H 256 M 0 160 H 256 M 0 192 H 256 M 0 224 H 256' stroke='%233b82f6' stroke-width='1.5'/></svg>" crossorigin="anonymous">
        
        <img id="lego-texture" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128'><rect width='128' height='128' fill='%2316a34a'/><pattern id='stud' width='32' height='32' patternUnits='userSpaceOnUse'><circle cx='16' cy='16' r='10' fill='%2315803d'/><circle cx='15' cy='15' r='8' fill='%2322c55e'/></pattern><rect width='128' height='128' fill='url(%23stud)'/></svg>" crossorigin="anonymous">
        
        <img id="lead-texture" src="lead1.png" crossorigin="anonymous">

        <img id="radiation-hazard-texture" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='-100 -100 200 200'><circle r='98' fill='%23fcd34d'/><circle r='87' fill='none' stroke='black' stroke-width='10'/><circle r='14' fill='black'/><g fill='black'><path d='M 20.78 -12 L 64.95 -37.5 A 75 75 0 0 1 64.95 37.5 L 20.78 12 A 24 24 0 0 0 20.78 -12 Z' transform='rotate(90)'/><path d='M 20.78 -12 L 64.95 -37.5 A 75 75 0 0 1 64.95 37.5 L 20.78 12 A 24 24 0 0 0 20.78 -12 Z' transform='rotate(210)'/><path d='M 20.78 -12 L 64.95 -37.5 A 75 75 0 0 1 64.95 37.5 L 20.78 12 A 24 24 0 0 0 20.78 -12 Z' transform='rotate(330)'/></g></svg>" crossorigin="anonymous">
    </a-assets>

    <a-camera id="main-camera" position="0 1.6 0"></a-camera>

    <a-entity id="radiation-source" visible="false">
        <a-plane src="#radiation-hazard-
