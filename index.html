<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR Pro</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui-header { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 85%; background: rgba(0,0,0,0.85); border: 1px solid #00f2ff; padding: 15px; border-radius: 15px; color: white; text-align: center; pointer-events: none; }
        .dose-val { font-size: 30px; color: #00ff00; font-weight: bold; }
        #control-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; background: rgba(20,20,20,0.95); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        input { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 5px; text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        /* 중앙 고정 조준점 (선원 표시) */
        #crosshair { position: fixed; top: 50%; left: 50%; width: 30px; height: 30px; border: 3px solid #00f2ff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 10px #00f2ff; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui-header">
        <div id="status" style="color:#00f2ff; font-size:12px;">지점을 조준하고 '측정 시작'을 누르세요</div>
        <div class="dose-val"><span id="dose-display">0.00</span> mSv/hr</div>
        <div id="dist-display" style="color:#ddd;">거리: - m</div>
    </div>

    <div id="control-panel">
        <input type="number" id="dose-input" value="10" placeholder="선량 입력">
        <button onclick="startMeasurement()">측정 시작 (지점 고정)</button>
        <button onclick="resetMeasurement()" style="background:#555;">초기화</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
        <a-entity camera position="0 0 0" look-controls wasd-controls-enabled="false"></a-entity>
    </a-scene>

    <script>
        let baseDose = 0;
        let isMeasuring = false;
        let fixedSourcePos = new THREE.Vector3(); // 고정된 선원 위치

        function startMeasurement() {
            baseDose = parseFloat(document.getElementById('dose-input').value);
            
            // 카메라 현재 위치에서 앞쪽 1.5m 지점을 선원 위치로 확정
            const cam = document.querySelector('a-entity[camera]').object3D;
            const forward = new THREE.Vector3(0, 0, -1.5).applyQuaternion(cam.quaternion);
            fixedSourcePos.copy(cam.position).add(forward);
            
            isMeasuring = true;
            document.getElementById('status').innerText = "측정 중: 이동하며 선량을 확인하세요";
        }

        function resetMeasurement() {
            isMeasuring = false;
            document.getElementById('dose-display').innerText = "0.00";
            document.getElementById('dist-display').innerText = "거리: - m";
            document.getElementById('status').innerText = "지점을 조준하고 '측정 시작'을 누르세요";
        }

        function update() {
            if (isMeasuring) {
                const cam = document.querySelector('a-entity[camera]').object3D;
                // 고정된 선원 위치와 카메라의 현재 위치 사이의 거리 계산
                const dist = cam.position.distanceTo(fixedSourcePos);
                
                // 역자승 법칙 (기준거리 0.5m)
                const d0 = 0.5;
                const dose = baseDose * Math.pow((d0 / Math.max(dist, 0.1)), 2);
                
                document.getElementById('dose-display').innerText = dose.toFixed(2);
                document.getElementById('dist-display').innerText = "거리: " + dist.toFixed(2) + " m";
            }
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
