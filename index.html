<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Hybrid Shielding Lab</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .hazard-glow { text-shadow: 0 0 20px rgba(239, 68, 68, 1); }
        
        #crosshair { position: fixed; top: 50%; left: 50%; width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; display: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }

        /* A-Frame 기본 AR/VR 진입 사각버튼 화면에서 완전히 숨기기 */
        .a-enter-vr, .a-enter-ar, .a-enter-ar-button, .a-enter-vr-button { display: none !important; }
    </style>
</head>
<body>

<div id="intro-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center px-6" style="background: url('background5.png') center/cover no-repeat;">
    
    <div class="w-full max-w-sm flex flex-col items-center translate-y-[150px]">
        
        <div class="bg-white/85 backdrop-blur-md p-6 rounded-xl border border-white/60 mb-[40px] text-center shadow-[0_8px_30px_rgba(0,0,0,0.15)] w-full">
            <label class="text-[13px] text-slate-700 uppercase font-extrabold block mb-3">실습 기준 선량 (1m 거리 기준)</label>
            <div class="flex items-center justify-center gap-2">
                <input type="number" id="base-dose-input" value="100" class="w-28 bg-white border-2 border-blue-200 rounded-lg py-3 px-2 text-slate-800 text-center font-orbitron text-2xl focus:border-blue-500 outline-none shadow-inner transition-colors">
                <span class="text-slate-700 font-bold">mSv/h</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-4 font-semibold">선원은 스마트폰 정면 <span class="text-blue-600 font-extrabold">3m 앞</span>에 생성됩니다.</p>
        </div>

        <button id="start-ar-btn" class="bg-green-600 hover:bg-green-500 px-8 py-4 rounded-2xl font-bold text-lg shadow-[0_0_20px_rgba(22,163,74,0.5)] transition-all active:scale-95 w-full text-white border border-green-400/50">
            실습 시작 (카메라 켜기)
        </button>
        
    </div>
</div>

<div id="ui-overlay" class="absolute inset-0 z-50 hidden" style="pointer-events: none;">
    
    <div id="crosshair"></div>

    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4">
        <div class="flex justify-between items-center mb-1">
            <span id="status-msg" class="text-[12px] text-amber-400 font-bold animate-pulse">원하는 위치를 조준하고 배치하세요</span>
            <span id="rad-type-badge" class="text-[10px] bg-red-600 px-2 py-1 rounded text-white font-bold uppercase"></span>
        </div>
        
        <div class="text-center py-1">
            <div id="dose-display" class="font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter">0.00</div>
            <div class="text-lg text-green-400 font-bold mt-1">mSv/h</div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-700/50 pt-3">
            <div class="text-center">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">선원과의 물리적 거리</div>
                <div id="dist-text" class="font-orbitron text-3xl text-sky-300">0.00 <span class="text-sm">m</span></div>
            </div>
            <div class="text-center border-l border-slate-700/5
