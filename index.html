    <title>Radiation AR - True Spatial Tracker</title>
    <!-- 최신 A-Frame -->

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; touch-action: none; }

</head>
<body class="text-slate-100">

<!-- 1. AR 시작 전 인트로 화면 -->
<div id="intro-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900 px-6">
    <div class="w-20 h-20 bg-sky-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(14,165,233,0.6)]">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
    </div>
    <h1 class="text-4xl font-orbitron font-bold text-white mb-2 text-center">Spatial AR</h1>
    <p class="text-sky-400 font-bold mb-8 text-center tracking-widest text-sm">초정밀 물리적 공간 스캐너</p>
    
    <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 mb-10 max-w-sm text-center shadow-xl">
        <p class="text-slate-300 text-[13px] leading-relaxed">

            스마트폰의 <strong>SLAM (공간 인식 센서)</strong>를 활용하여 현실 공간의 3차원 좌표를 스캔하고, 선원과 사용자 간의 <strong>물리적인 실제 거리</strong>를 실시간으로 직접 측정합니다.
        </p>
        <p class="text-amber-400 text-[11px] mt-4 font-bold bg-amber-900/30 p-2 rounded-lg">
            ⚠️ 필수: Android Chrome 브라우저<br>
            (기기가 WebXR을 지원해야 작동합니다)
        </p>
    </div>

    <button id="custom-ar-btn" class="bg-sky-600 hover:bg-sky-500 px-8 py-4 rounded-2xl font-bold text-lg shadow-[0_0_20px_rgba(2,132,199,0.5)] transition-all active:scale-95 w-full max-w-sm uppercase tracking-wider text-white">
        AR 공간 스캔 시작하기
    </button>
</div>

<!-- 2. AR 실행 중 DOM Overlay UI -->
<div id="ui-container" class="absolute inset-0 z-50 hidden" style="pointer-events: none;">
    <!-- 상단 메인 HUD -->
    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-5 border-t-2 border-sky-400">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[11px] text-sky-400 font-bold tracking-widest uppercase">공간 3D 트래킹 활성</span>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,1)] animate-pulse"></div>
            </div>
        </div>
        
        <div class="text-center py-2">
            <div id="dose-display" class="font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter">0.00</div>
            <div class="text-lg text-green-400 font-bold mt-1">mSv/h</div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4 border-t border-slate-700/50 pt-4">
            <div class="text-center">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter">실제 물리적 거리</div>
                <div id="dist-text" class="font-orbitron text-3xl text-sky-300">0.00 m</div>
            </div>
            <div class="text-center border-l border-slate-700/50">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter">누적 피폭량</div>
                <div id="cum-text" class="font-orbitron text-3xl text-amber-400">0.000</div>
            </div>
        </div>
    </div>

    <!-- 중앙 조준점 -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 border-2 border-sky-400/80 rounded-full flex items-center justify-center">
        <div class="w-1.5 h-1.5 bg-sky-400 rounded-full"></div>
    </div>

    <!-- 하단 컨트롤 패널 -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg pointer-events-auto flex flex-col gap-3">
        <div class="glass p-5 rounded-2xl">
            <div class="flex items-center justify-between mb-4">
                <label class="text-[11px] text-slate-300 uppercase font-bold">50cm 지점 기준 선량 (mSv/h)</label>
                <input type="number" id="base-dose-input" value="100" class="w-24 bg-slate-900 border border-slate-600 rounded-lg py-2 px-2 text-white text-center font-orbitron focus:border-sky-500 outline-none">
            </div>
            
            <button id="place-source-btn" class="w-full bg-rose-600 hover:bg-rose-500 py-4 rounded-xl font-bold text-white shadow-[0_0_15px_rgba(225,29,72,0.4)] transition-all active:scale-95 text-[15px] uppercase tracking-wider flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                카메라 50cm 앞 선원 고정
            </button>
        </div>
    </div>
</div>

<!-- 3. WebXR AR 공간 -->
<!-- dom-overlay를 사용하여 HTML UI를 AR 카메라 화면 위에 띄웁니다 -->
<a-scene 
    webxr="optionalFeatures: dom-overlay; overlayElement: #ui-container"
    vr-mode-ui="enabled: true"
    renderer="alpha: true; antialias: true">
    
    <a-camera id="main-camera" position="0 1.6 0"></a-camera>

    <!-- 방사선원 AR 객체 -->
    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.04" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 3"
                  animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 600">
        </a-sphere>
        <a-text id="source-label" value="TARGET" align="center" position="0 0.15 0" color="#ff4444" scale="0.3 0.3 0.3" font="mozillavr"></a-text>
        <a-ring radius-inner="0.06" radius-outer="0.08" color="#ff0000" material="opacity: 0.8; side: double"
                animation__scale="property: scale; from: 1 1 1; to: 6 6 6; loop: true; dur: 1500; easing: linear"
                animation__opacity="property: material.opacity; from: 0.8; to: 0; loop: true; dur: 1500; easing: linear">
        </a-ring>
    </a-entity>
</a-scene>

<script>
let fixedSourcePos = new THREE.Vector3();
let baseDoseAt05m = 100;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();

const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

const sceneEl = document.querySelector('a-scene');

// --- [이벤트] AR 시작 버튼 클릭 ---
document.getElementById('custom-ar-btn').addEventListener('click', async () => {
    try {
        await Tone.start(); // 사운드 권한 허용
        const arBtn = document.querySelector('.a-enter-ar-button');
        if (arBtn) {
            arBtn.click(); // A-Frame의 기본 AR 진입 버튼을 코드로 클릭
        } else {
            alert("기기 또는 브라우저가 WebXR 공간 인식을 지원하지 않습니다.\n(최신 안드로이드 및 Chrome을 권장합니다.)");
        }
    } catch (err) {
        console.error(err);
    }
});

// --- [이벤트] AR 모드 진입 성공 시 ---
sceneEl.addEventListener('enter-vr', function () {
    if (sceneEl.is('ar-mode')) {
        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('ui-container').style.display = 'block';
        showToast("방 안을 스캔합니다. 바닥을 향해 폰을 살짝 움직여주세요.");
    }
});

// --- [이벤트] AR 모드 종료 시 ---
sceneEl.addEventListener('exit-vr', function () {
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('ui-container').style.display = 'none';
    targetLocked = false;
    document.getElementById('radiation-source').setAttribute('visible', false);
});

// --- [이벤트] 선원 배치 버튼 클릭 ---
document.getElementById('place-source-btn').addEventListener('click', () => {
    const camera = document.querySelector('#main-camera').object3D;
    const sourceEl = document.querySelector('#radiation-source');

    let camWorldPos = new THREE.Vector3();
    camera.getWorldPosition(camWorldPos);

    let camWorldDir = new THREE.Vector3();
    camera.getWorldDirection(camWorldDir);

    // 카메라(내 눈 위치)에서 정면으로 0.5m 앞 물리적 좌표를 계산
    fixedSourcePos.copy(camWorldPos).add(camWorldDir.multiplyScalar(0.5));
    
    // 그 공간 좌표에 구체를 영구 고정
    sourceEl.setAttribute('position', `${fixedSourcePos.x} ${fixedSourcePos.y} ${fixedSourcePos.z}`);
    sourceEl.setAttribute('visible', true);

    baseDoseAt05m = parseFloat(document.getElementById('base-dose-input').value) || 100;
    targetLocked = true;
    cumulativeDose = 0;
    lastFrameTime = performance.now();

    showToast("완료! 물리적 거리가 측정됩니다. 멀어지거나 다가가 보세요.");
});

// --- 메인 계산 루프 (초당 60프레임) ---
let nextTickTime = 0;
function update() {
    // AR 모드이고, 타겟이 고정되어 있을 때만 거리 계산 수행
    if (targetLocked && sceneEl.is('ar-mode')) {
        const now = performance.now();
        const dtHours = (now - lastFrameTime) / 3600000;
        lastFrameTime = now;

        let currentCamPos = new THREE.Vector3();
        document.querySelector('#main-camera').object3D.getWorldPosition(currentCamPos);
        
        // ★ 핵심: 현재 카메라(스마트폰)의 X,Y,Z 위치와 구체의 X,Y,Z 위치의 거리를 수학적으로 계산
        let dist = currentCamPos.distanceTo(fixedSourcePos);
        dist = Math.max(0.05, dist); // 5cm 최소 거리 보정

        // 역자승 법칙 (0.5m 기준)
        const currentDoseRate = baseDoseAt05m * Math.pow(0.5 / dist, 2);
        cumulativeDose += currentDoseRate * dtHours;

        document.getElementById('source-label').setAttribute('value', `Target: 50cm\n${currentDoseRate.toFixed(1)} mSv/h`);

        const doseDisp = document.getElementById('dose-display');
        document.getElementById('dist-text').innerText = `${dist.toFixed(2)} m`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(4);
        doseDisp.innerText = currentDoseRate.toFixed(2);

        if (currentDoseRate > baseDoseAt05m * 1.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-red-500 hazard-glow animate-pulse leading-none tracking-tighter";
        } else if (currentDoseRate > baseDoseAt05m * 0.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-yellow-400 leading-none tracking-tighter";
        } else {
            doseDisp.className = "font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter";
        }

        const tickInterval = Math.max(20, 1000 / (currentDoseRate * 0.5 + 1));
        if (now > nextTickTime) {
            synth.triggerAttackRelease("32n");
            nextTickTime = now + tickInterval;
        }

        // 구체가 항상 카메라를 바라봄
        document.querySelector('#radiation-source').object3D.lookAt(currentCamPos);
    }
    requestAnimationFrame(update);
}

function showToast(m) {
    const t = document.createElement('div');
    t.className = "fixed top-1/3 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-8 py-4 rounded-xl z-[3000] border border-sky-500 text-[13px] font-bold shadow-[0_0_20px_rgba(0,0,0,0.8)] transition-all duration-300 pointer-events-none text-center whitespace-nowrap";
    t.innerText = m;
    document.getElementById('ui-container').appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 500);
    }, 2500);
}

// 렌더링 루프 시작
update();
</script>
</body>
</html>
