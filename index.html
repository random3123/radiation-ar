<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Shielding Lab</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); }
        #crosshair { position: fixed; top: 50%; left: 50%; width: 24px; height: 24px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; display: none; }
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

<!-- 인트로 화면 -->
<div id="intro-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900 px-6">
    <h1 class="text-3xl font-bold text-white mb-6">방사선 차폐 실습</h1>
    <div class="bg-slate-800 p-6 rounded-xl w-full max-w-sm space-y-4">
        <div>
            <label class="text-xs text-slate-400 font-bold block mb-1">방사선 종류</label>
            <select id="radiation-type" class="w-full bg-slate-900 text-white p-2 rounded">
                <option value="alpha">알파선 (α)</option>
                <option value="beta">베타선 (β)</option>
                <option value="gamma">감마선 (γ)</option>
            </select>
        </div>
        <div>
            <label class="text-xs text-slate-400 font-bold block mb-1">기준 선량 (1m 기준, mSv/h)</label>
            <input type="number" id="base-dose-input" value="100" class="w-full bg-slate-900 text-white p-2 rounded">
        </div>
    </div>
    <button id="start-ar-btn" class="mt-8 bg-green-600 px-8 py-4 rounded-xl font-bold text-white w-full max-w-sm">실습 시작</button>
</div>

<!-- 실습 UI -->
<div id="ui-overlay" class="absolute inset-0 z-50 hidden" style="pointer-events: none;">
    <div id="crosshair"></div>
    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4 text-center">
        <div id="dose-display" class="font-orbitron text-6xl font-bold text-green-400">0.00</div>
        <div id="dist-text" class="text-sky-300 font-bold">거리: 0.00m</div>
    </div>
    
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg pointer-events-auto space-y-3">
        <select id="shield-type" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-600">
            <option value="none">차폐체 없음</option>
            <option value="paper">종이 (Paper)</option>
            <option value="plastic">플라스틱 (Plastic)</option>
            <option value="lead">납 (Lead)</option>
        </select>
        <div class="flex gap-2">
            <button id="place-btn" class="flex-1 bg-rose-600 py-4 rounded-xl font-bold text-white">📍 선원 고정 (3m)</button>
            <button id="shield-btn" class="flex-1 bg-indigo-600 py-4 rounded-xl font-bold text-white">🛡️ 차폐체 배치 (2m)</button>
        </div>
        <button id="reset-btn" class="w-full bg-slate-700 py-3 rounded-xl font-bold text-white hidden">초기화</button>
    </div>
</div>

<a-scene webxr="optionalFeatures: dom-overlay; overlayElement: #ui-overlay" renderer="alpha: true; antialias: true">
    <a-camera id="main-camera" position="0 1.6 0"></a-camera>
    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.08" color="#ff0000"></a-sphere>
    </a-entity>
    <a-entity id="shield-object" visible="false">
        <a-plane width="1.5" height="1.5" color="#ffffff" material="opacity: 0.5"></a-plane>
    </a-entity>
</a-scene>

<script>
let state = { targetLocked: false, radiationType: 'alpha', baseDose: 100, sourcePos: null, shieldPos: null, shieldActive: false, shieldMaterial: 'none' };

// 차폐 데이터 (남은 선량 비율)
const shieldingData = {
    alpha: { paper: 0.01, plastic: 0, lead: 0 },
    beta: { paper: 1.0, plastic: 0.1, lead: 0 },
    gamma: { paper: 1.0, plastic: 1.0, lead: 0.4 }
};

document.getElementById('start-ar-btn').addEventListener('click', () => {
    state.radiationType = document.getElementById('radiation-type').value;
    state.baseDose = parseFloat(document.getElementById('base-dose-input').value);
    document.querySelector('.a-enter-ar-button').click();
});

document.querySelector('a-scene').addEventListener('enter-vr', () => {
    document.getElementById('intro-screen').style.display = 'none';
    document.getElementById('ui-overlay').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
});

// 선원 배치 (3m 앞)
document.getElementById('place-btn').addEventListener('click', () => {
    const camera = document.getElementById('main-camera').object3D;
    state.sourcePos = new THREE.Vector3(0, 0, -3).applyMatrix4(camera.matrixWorld);
    document.getElementById('radiation-source').setAttribute('position', state.sourcePos);
    document.getElementById('radiation-source').setAttribute('visible', 'true');
    state.targetLocked = true;
    document.getElementById('place-btn').classList.add('hidden');
    document.getElementById('reset-btn').classList.remove('hidden');
});

// 차폐체 배치 (2m 앞)
document.getElementById('shield-btn').addEventListener('click', () => {
    const camera = document.getElementById('main-camera').object3D;
    state.shieldMaterial = document.getElementById('shield-type').value;
    if(state.shieldMaterial === 'none') return;
    
    state.shieldPos = new THREE.Vector3(0, 0, -2).applyMatrix4(camera.matrixWorld);
    const sObj = document.getElementById('shield-object');
    sObj.setAttribute('position', state.shieldPos);
    sObj.setAttribute('visible', 'true');
    state.shieldActive = true;
    sObj.object3D.lookAt(camera.position); // 사용자를 바라보게
});

function update() {
    if (state.targetLocked) {
        const cam = document.getElementById('main-camera').object3D;
        const camPos = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
        const dist = camPos.distanceTo(state.sourcePos);
        
        // 차폐 효과 계산 (사용자가 선원과 차폐체 사이에 있는 경우만)
        let dose = state.baseDose * Math.pow(1.0 / Math.max(0.1, dist), 2);
        
        if (state.shieldActive && camPos.distanceTo(state.sourcePos) > camPos.distanceTo(state.shieldPos)) {
            const factor = shieldingData[state.radiationType][state.shieldMaterial] || 1.0;
            dose *= factor;
        }

        document.getElementById('dose-display').innerText = dose.toFixed(2);
        document.getElementById('dist-text').innerText = `거리: ${dist.toFixed(1)}m`;
    }
    requestAnimationFrame(update);
}
update();

function resetSystem() { location.reload(); }
document.getElementById('reset-btn').addEventListener('click', resetSystem);
</script>
</body>
</html>
