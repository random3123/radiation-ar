<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Radiation AR - Pro Simulator</title>
    <!-- A-Frame & Tailwind & Tone.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #camera-feed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.8; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .hazard-glow { text-shadow: 0 0 20px rgba(239, 68, 68, 1); }
        
        /* 중앙 조준점 */
        #crosshair { position: fixed; top: 50%; left: 50%; width: 30px; height: 30px; border: 2px dashed rgba(56, 189, 248, 0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #38bdf8; border-radius: 50%; transform: translate(-50%, -50%); }

        /* 세로 슬라이더 커스텀 디자인 */
        input[type=range][orient=vertical] {
            appearance: slider-vertical;
            width: 20px;
            height: 250px;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-slate-100">

<!-- 카메라 배경 -->
<video id="camera-feed" autoplay playsinline muted></video>
<div id="crosshair"></div>

<!-- 상단 메인 HUD -->
<div id="ui-header" class="fixed top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-5 z-[1001] pointer-events-none transition-all">
    <div class="flex justify-between items-center mb-1">
        <span class="text-[11px] text-sky-400 font-bold tracking-widest uppercase">Radiation AR Simulator</span>
        <div class="flex items-center gap-2">
            <span id="status-text" class="text-[10px] text-slate-400 font-bold">대기 중</span>
            <div id="status-light" class="w-3 h-3 rounded-full bg-slate-600"></div>
        </div>
    </div>
    
    <div class="text-center py-2">
        <div id="instruction" class="text-[12px] text-amber-400 font-bold mb-1 uppercase animate-pulse">원하는 방향을 보고 하단 '선원 배치'를 누르세요</div>
        <div id="dose-display" class="font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter">0.00</div>
        <div class="text-lg text-green-400 font-bold mt-1">mSv/h</div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-4 border-t border-slate-700/50 pt-4">
        <div class="text-center">
            <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">선원과의 거리</div>
            <div id="dist-text" class="font-orbitron text-3xl text-sky-300">0.00 <span class="text-sm">m</span></div>
        </div>
        <div class="text-center border-l border-slate-700/50">
            <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter mb-1">누적 피폭량</div>
            <div id="cum-text" class="font-orbitron text-3xl text-amber-400">0.0000</div>
        </div>
    </div>
</div>

<!-- 우측 거리 조절 슬라이더 (배치 후 표시됨) -->
<div id="slider-container" class="fixed right-4 top-1/2 -translate-y-1/2 z-[1002] glass p-3 rounded-2xl flex flex-col items-center gap-3" style="display: none;">
    <span class="text-[10px] font-bold text-sky-400 uppercase text-center w-12">멀어지기</span>
    <input type="range" id="distance-slider" orient="vertical" min="0.1" max="5.0" step="0.05" value="0.5">
    <span class="text-[10px] font-bold text-rose-400 uppercase text-center w-12">다가가기</span>
</div>

<!-- 하단 컨트롤 패널 -->
<div id="control-panel" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-lg z-[1002]">
    <div class="glass p-5 rounded-2xl">
        <div class="flex flex-col gap-4">
            
            <!-- 선량 입력 -->
            <div class="flex justify-between items-center gap-4 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                <label class="text-[12px] text-slate-300 uppercase font-bold flex-1">설정 선량<br><span class="text-[9px] text-slate-500">(50cm 기준)</span></label>
                <div class="relative w-32">
                    <input type="number" id="base-dose-input" value="100" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3 text-white text-xl font-orbitron text-right focus:border-sky-500 outline-none pr-10">
                    <span class="absolute right-3 top-2.5 text-slate-500 font-bold text-sm">mSv</span>
                </div>
            </div>
            
            <!-- 액션 버튼 -->
            <div class="grid grid-cols-2 gap-3">
                <button id="place-btn" onclick="placeSource()" class="bg-rose-600 hover:bg-rose-500 py-4 rounded-xl font-bold text-white shadow-[0_0_15px_rgba(225,29,72,0.4)] active:scale-95 text-[14px] uppercase transition-all">
                    1. 선원 배치하기
                </button>
                <button id="reset-btn" onclick="resetSystem()" class="bg-sky-600 hover:bg-sky-500 py-4 rounded-xl font-bold text-white shadow-[0_0_15px_rgba(2,132,199,0.4)] active:scale-95 text-[14px] uppercase transition-all">
                    2. 초기화 (Reset)
                </button>
            </div>

        </div>
    </div>
</div>

<!-- AR 3D 씬 -->
<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <!-- Rig: 사용자의 몸체 (슬라이더로 전진/후진 제어) -->
    <a-entity id="rig" position="0 1.6 0">
        <!-- Camera: 사용자의 머리 (회전 제어) -->
        <a-camera id="main-camera" look-controls="pointerLockEnabled: false"></a-camera>
    </a-entity>

    <!-- 방사선원 (빨간 구체) -->
    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.05" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 3"
                  animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 500">
        </a-sphere>
        <a-text id="source-label" value="SOURCE" align="center" position="0 0.15 0" color="#ff4444" scale="0.4 0.4 0.4"></a-text>
        <a-ring radius-inner="0.07" radius-outer="0.09" color="#ff0000" material="opacity: 0.8; side: double"
                animation__scale="property: scale; from: 1 1 1; to: 6 6 6; loop: true; dur: 1500; easing: linear"
                animation__opacity="property: material.opacity; from: 0.8; to: 0; loop: true; dur: 1500; easing: linear">
        </a-ring>
    </a-entity>
</a-scene>

<script>
// --- 전역 상태 변수 ---
let isPlaced = false;
let baseDoseAt05m = 100;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let initialCameraDir = new THREE.Vector3(); // 배치 시 카메라가 보던 방향 저장

// 사운드 엔진
const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

// 카메라 비디오 스트림 가져오기
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        document.getElementById('camera-feed').srcObject = stream;
    } catch (e) {
        console.warn("카메라를 사용할 수 없습니다.");
    }
}
startCamera();

// --- 선원 배치 기능 ---
async function placeSource() {
    await Tone.start(); // 사운드 권한 활성화

    const rig = document.getElementById('rig').object3D;
    const camera = document.getElementById('main-camera').object3D;
    const sourceEl = document.getElementById('radiation-source');

    // 배치 시 기준 선량 설정
    baseDoseAt05m = parseFloat(document.getElementById('base-dose-input').value) || 100;

    // 카메라의 현재 월드 방향 및 위치 가져오기
    let camWorldPos = new THREE.Vector3();
    camera.getWorldPosition(camWorldPos);

    camera.getWorldDirection(initialCameraDir);
    initialCameraDir.y = 0; // 지면과 평행하게 유지
    initialCameraDir.normalize();

    // 1. 카메라 위치에서 정면으로 정확히 0.5m 앞 지점에 선원 생성
    let sourcePos = new THREE.Vector3().copy(camWorldPos).add(initialCameraDir.clone().multiplyScalar(0.5));
    
    sourceEl.setAttribute('position', `${sourcePos.x} ${sourcePos.y} ${sourcePos.z}`);
    sourceEl.setAttribute('visible', 'true');

    // 2. 상태 잠금 및 슬라이더 활성화
    isPlaced = true;
    cumulativeDose = 0;
    lastFrameTime = performance.now();

    // UI 업데이트
    document.getElementById('status-light').className = "w-3 h-3 rounded-full bg-red-500 animate-pulse shadow-[0_0_12px_rgba(239,68,68,1)]";
    document.getElementById('status-text').innerText = "측정 중";
    document.getElementById('instruction').innerText = "우측 슬라이더를 위아래로 움직여 거리를 조절하세요";
    document.getElementById('instruction').className = "text-[12px] text-sky-400 font-bold mb-1";
    document.getElementById('crosshair').style.borderColor = "rgba(239, 68, 68, 0.8)";
    
    // 슬라이더 보이기 (기본값 0.5m)
    const sliderContainer = document.getElementById('slider-container');
    const slider = document.getElementById('distance-slider');
    slider.value = 0.5;
    sliderContainer.style.display = 'flex';

    showToast("50cm 앞에 선원이 고정되었습니다! 우측 슬라이더로 거리를 조절해보세요.");
}

// --- 시스템 초기화 (Reset) 기능 ---
function resetSystem() {
    isPlaced = false;
    cumulativeDose = 0;
    
    // Rig 위치 초기화
    document.getElementById('rig').object3D.position.set(0, 1.6, 0);
    
    // 소스 숨기기
    document.getElementById('radiation-source').setAttribute('visible', 'false');
    
    // 슬라이더 숨기기
    document.getElementById('slider-container').style.display = 'none';

    // UI 텍스트 초기화
    const doseDisp = document.getElementById('dose-display');
    doseDisp.innerText = "0.00";
    doseDisp.className = "font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter";
    
    document.getElementById('dist-text').innerHTML = `0.00 <span class="text-sm">m</span>`;
    document.getElementById('cum-text').innerText = "0.0000";
    
    document.getElementById('status-light').className = "w-3 h-3 rounded-full bg-slate-600";
    document.getElementById('status-text').innerText = "대기 중";
    document.getElementById('instruction').innerText = "원하는 방향을 보고 하단 '선원 배치'를 누르세요";
    document.getElementById('instruction').className = "text-[12px] text-amber-400 font-bold mb-1 uppercase animate-pulse";
    document.getElementById('crosshair').style.borderColor = "rgba(56, 189, 248, 0.8)";

    showToast("시스템이 초기화되었습니다. 다시 배치할 수 있습니다.");
}

// --- 슬라이더 조작 이벤트 (거리에 따라 사용자의 몸체를 앞뒤로 이동) ---
document.getElementById('distance-slider').addEventListener('input', function(e) {
    if (!isPlaced) return;
    
    const targetDist = parseFloat(e.target.value);
    const rig = document.getElementById('rig').object3D;
    
    // 기본 거리 0.5m 대비 슬라이더 값이 얼마나 변했는지 계산하여 그만큼 뒤로 이동
    // 슬라이더가 2.0m라면, 0.5m 지점에서 1.5m 더 뒤로(initialCameraDir의 반대방향) 물러남
    const pullBackDistance = targetDist - 0.5; 
    
    // Rig 위치 업데이트
    let newRigPos = new THREE.Vector3(0, 1.6, 0).sub(initialCameraDir.clone().multiplyScalar(pullBackDistance));
    rig.position.copy(newRigPos);
});

// --- 메인 렌더링 루프 (거리 측정 및 선량 계산) ---
let nextTickTime = 0;
function update() {
    const now = performance.now();
    const dtHours = (now - lastFrameTime) / 3600000;
    lastFrameTime = now;

    if (isPlaced) {
        // 카메라와 선원 객체 가져오기
        let currentCamPos = new THREE.Vector3();
        document.getElementById('main-camera').object3D.getWorldPosition(currentCamPos);
        
        let sourcePos = new THREE.Vector3();
        document.getElementById('radiation-source').object3D.getWorldPosition(sourcePos);
        
        // 1. 물리적 거리 계산
        let dist = currentCamPos.distanceTo(sourcePos);
        
        // 정확도 스냅 (오차 보정): 거리가 0.5m에 매우 가까우면 정확히 0.5로 고정하여 입력한 기준 선량이 깔끔하게 떨어지도록 함
        if (Math.abs(dist - 0.5) < 0.01) dist = 0.5;
        // 최소 거리 제한 (수치 폭주 방지)
        dist = Math.max(0.05, dist);

        // 2. 역자승 법칙 계산 (0.5m 기준)
        const currentDoseRate = baseDoseAt05m * Math.pow(0.5 / dist, 2);
        
        // 3. 누적 피폭량 계산 (시간 단위 누적)
        cumulativeDose += currentDoseRate * dtHours;

        // --- UI 업데이트 ---
        document.getElementById('source-label').setAttribute('value', `TARGET\n${currentDoseRate.toFixed(1)} mSv/h`);
        
        const doseDisp = document.getElementById('dose-display');
        document.getElementById('dist-text').innerHTML = `${dist.toFixed(2)} <span class="text-sm">m</span>`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(4);
        doseDisp.innerText = currentDoseRate.toFixed(2);

        // 위험 단계별 색상 변화
        if (currentDoseRate > baseDoseAt05m * 1.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-red-500 hazard-glow leading-none tracking-tighter";
        } else if (currentDoseRate > baseDoseAt05m * 0.5) {
            doseDisp.className = "font-orbitron text-7xl font-bold text-yellow-400 leading-none tracking-tighter";
        } else {
            doseDisp.className = "font-orbitron text-7xl font-bold text-green-400 leading-none tracking-tighter";
        }

        // 가이거 카운터 사운드 피드백 (선량이 높을수록 간격이 짧아짐)
        const tickInterval = Math.max(20, 1000 / (currentDoseRate * 0.5 + 1));
        if (now > nextTickTime) {
            synth.triggerAttackRelease("32n");
            nextTickTime = now + tickInterval;
        }

        // 구체가 항상 카메라(사용자)를 바라보도록 설정
        document.getElementById('radiation-source').object3D.lookAt(currentCamPos);
    }
    
    requestAnimationFrame(update);
}

// 토스트 메시지 띄우기 함수
function showToast(m) {
    const t = document.createElement('div');
    t.className = "fixed top-1/3 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-6 py-3 rounded-xl z-[3000] border border-sky-500 text-[12px] font-bold shadow-[0_0_20px_rgba(0,0,0,0.8)] transition-all duration-300 pointer-events-none text-center whitespace-nowrap";
    t.innerText = m;
    document.body.appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 500);
    }, 2500);
}

// 렌더링 시작
window.onload = () => update();
</script>
</body>
</html>
