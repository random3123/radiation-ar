```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR 거리 측정기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        #info-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            z-index: 10;
            text-align: center;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #status {
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }

        #distance-display {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }

        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-secondary {
            background: #f44336;
            color: white;
        }

        #unsupported-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #222;
            color: white;
            padding: 40px;
            text-align: center;
            z-index: 100;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="info-overlay" class="glass-panel">
        <div id="status">AR 시스템 초기화 중...</div>
        <div id="distance-display">0.00 m</div>
    </div>

    <div id="controls">
        <button id="reset-btn" class="btn btn-secondary">다시 측정</button>
        <button id="ar-button" class="btn btn-primary">AR 시작하기</button>
    </div>

    <div id="unsupported-message">
        <h2>AR을 지원하지 않는 브라우저입니다.</h2>
        <p>안드로이드의 Chrome 브라우저 최신 버전을 사용해 주세요.</p>
        <p>또한 'Google Play 서비스용 AR'이 설치되어 있어야 합니다.</p>
    </div>

    <script type="module">
        let container;
        let camera, scene, renderer;
        let controller;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        let points = [];
        let line = null;
        let measureLabel = document.getElementById('distance-display');
        let statusLabel = document.getElementById('status');
        const arButton = document.getElementById('ar-button');
        const resetBtn = document.getElementById('reset-btn');

        // Check WebXR support
        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (supported) {
                    arButton.addEventListener('click', onStartAR);
                } else {
                    document.getElementById('unsupported-message').style.display = 'block';
                    arButton.style.display = 'none';
                }
            });
        } else {
            document.getElementById('unsupported-message').style.display = 'block';
            arButton.style.display = 'none';
        }

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Controller / Touch logic
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // Reticle (Targeting Ring)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x4CAF50 })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            resetBtn.addEventListener('click', resetMeasurement);

            window.addEventListener('resize', onWindowResize);
        }

        function onStartAR() {
            const sessionInit = { requiredFeatures: ['hit-test'] };
            navigator.xr.requestSession('immersive-ar', sessionInit).then(onSessionStarted);
            arButton.style.display = 'none';
        }

        async function onSessionStarted(session) {
            renderer.xr.setReferenceSpaceType('local');
            await renderer.xr.setSession(session);
            statusLabel.innerText = "바닥을 천천히 비춰주세요...";
            init();
            animate();
        }

        function onSelect() {
            if (reticle.visible) {
                // Add a measurement point at the reticle position
                const point = new THREE.Vector3();
                point.setFromMatrixPosition(reticle.matrix);
                
                // Add visual marker
                const geometry = new THREE.SphereGeometry(0.02, 16, 16);
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.copy(point);
                scene.add(sphere);

                points.push(point);

                if (points.length >= 2) {
                    updateLine();
                    statusLabel.innerText = "측정 완료! (두 점 사이 거리)";
                } else {
                    statusLabel.innerText = "다음 지점을 선택해 주세요.";
                }
            }
        }

        function updateLine() {
            if (points.length < 2) return;

            if (line) scene.remove(line);

            const material = new THREE.LineBasicMaterial({ color: 0x4CAF50, linewidth: 5 });
            const geometry = new THREE.BufferGeometry().setFromPoints([points[points.length - 2], points[points.length - 1]]);
            line = new THREE.Line(geometry, material);
            scene.add(line);

            const dist = points[points.length - 2].distanceTo(points[points.length - 1]);
            measureLabel.innerText = dist.toFixed(2) + " m";
        }

        function resetMeasurement() {
            points = [];
            if (line) {
                scene.remove(line);
                line = null;
            }
            // Remove spheres
            scene.children = scene.children.filter(child => {
                if (child.type === "Mesh" && child !== reticle) {
                    scene.remove(child);
                    return false;
                }
                return true;
            });
            measureLabel.innerText = "0.00 m";
            statusLabel.innerText = "바닥을 비춰 지점을 선택하세요.";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
