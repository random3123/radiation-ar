<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>실시간 카메라 거리 측정</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui-layer {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            width: 80%; z-index: 100; pointer-events: none;
        }
        .glass-card {
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; color: white; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #distance { font-size: 40px; font-weight: 800; color: #00e676; margin: 5px 0; }
        #status { font-size: 14px; color: #bbb; }
        #controls { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .btn {
            padding: 18px 35px; border-radius: 50px; border: none; font-weight: bold;
            font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #ar-btn { background: #00e676; color: black; }
        #reset-btn { background: #ff5252; color: white; display: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="glass-card">
            <div id="status">AR 시작 버튼을 눌러주세요</div>
            <div id="distance">0.00 m</div>
        </div>
    </div>

    <div id="controls">
        <button id="ar-btn" class="btn">AR 카메라 시작</button>
        <button id="reset-btn" class="btn">다시 측정 (지점 초기화)</button>
    </div>

    <script type="module">
        let camera, scene, renderer, controller;
        let reticle, hitTestSource = null, hitTestSourceRequested = false;
        let startPoint = null; // 고정된 첫 번째 지점
        let line = null; // 실시간 연결 선

        const statusEl = document.getElementById('status');
        const distanceEl = document.getElementById('distance');
        const arBtn = document.getElementById('ar-btn');
        const resetBtn = document.getElementById('reset-btn');

        async function startAR() {
            const session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test']
            });
            
            init(session);
            arBtn.style.display = 'none';
            resetBtn.style.display = 'block';
            statusEl.innerText = "바닥을 스캔 후, 측정 시작점을 터치하세요";
        }

        function init(session) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            renderer.xr.setReferenceSpaceType('local');
            renderer.xr.setSession(session);

            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // 조준점 (가이드)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00e676 })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            renderer.setAnimationLoop(render);
        }

        function onSelect() {
            if (reticle.visible && !startPoint) {
                // 첫 번째 지점 고정
                startPoint = new THREE.Vector3();
                startPoint.setFromMatrixPosition(reticle.matrix);

                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.02, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                sphere.position.copy(startPoint);
                scene.add(sphere);

                statusEl.innerText = "기점 고정됨! 이제 움직여보세요.";
            }
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // 1. 바닥 인식 (Hit Test) logic
                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(ref => {
                        session.requestHitTestSource({ space: ref }).then(src => hitTestSource = src);
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitResults = frame.getHitTestResults(hitTestSource);
                    if (hitResults.length > 0) {
                        reticle.visible = true;
                        reticle.matrix.fromArray(hitResults[0].getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }

                // 2. 실시간 거리 계산 (고정점 vs 현재 카메라)
                if (startPoint) {
                    // XR 세션에서 현재 카메라(뷰어)의 위치 정보 가져오기
                    const viewerPose = frame.getViewerPose(referenceSpace);
                    if (viewerPose) {
                        const cameraPos = new THREE.Vector3(
                            viewerPose.transform.position.x,
                            viewerPose.transform.position.y,
                            viewerPose.transform.position.z
                        );

                        // 거리 계산
                        const dist = startPoint.distanceTo(cameraPos);
                        distanceEl.innerText = dist.toFixed(2) + " m";

                        // 실시간 선 업데이트
                        if (line) scene.remove(line);
                        const geometry = new THREE.BufferGeometry().setFromPoints([startPoint, cameraPos]);
                        line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0x00e676 }));
                        scene.add(line);
                    }
                }
            }
            renderer.render(scene, camera);
        }

        arBtn.addEventListener('click', startAR);
        resetBtn.addEventListener('click', () => location.reload());
    </script>
</body>
</html>
