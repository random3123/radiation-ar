<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Spatial Tracking</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: black; font-family: sans-serif; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 1000; pointer-events: none;
        }
        #ui-header {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(0,0,0,0.8); border: 1px solid #00f2ff;
            border-radius: 12px; padding: 12px; color: white; text-align: center; z-index: 1001;
        }
        .main-dose { font-size: 32px; font-weight: bold; color: #00ff00; }
        #control-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(20,20,20,0.9); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 1002;
        }
        input, button { padding: 12px; border-radius: 8px; border: none; font-size: 15px; }
        input { background: #333; color: white; text-align: center; }
        button { font-weight: bold; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div id="ui-header">
    <div id="status">1. AR 시작 -> 2. 벽면 조준 후 타겟 지정</div>
    <div class="main-dose"><span id="dose-rate">0.00</span> mSv/hr</div>
    <div id="distance">거리: 0.00 m</div>
    <div id="cumulative-dose" style="font-size: 13px; color: #ccc;">누적 피폭량: 0.0000 mSv</div>
</div>

<div id="control-panel">
    <input type="number" id="base-dose-input" value="10" step="0.1" placeholder="기준 선량률">
    <!-- AR 모드 진입 버튼 (WebXR 활성화) -->
    <button onclick="enterAR()" style="background:#007bff;">1. AR 시작 (공간 추적)</button>
    <button onclick="lockTarget()" style="background:#28a745;">2. 벽면 타겟 지정</button>
    <button onclick="location.reload()" style="background:#444;">초기화</button>
</div>

<!-- WebXR 기반의 Scene 설정 -->
<a-scene webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #ui-header"
         renderer="alpha: true; antialias: true"
         vr-mode-ui="enabled: false">
    
    <a-entity id="main-camera" camera look-controls position="0 1.6 0"></a-entity>

    <!-- 타겟 마커 -->
    <a-sphere id="target-marker" radius="0.1" color="red" visible="false"
              material="emissive: red; emissiveIntensity: 2;"></a-sphere>

    <!-- 거리 표시 라벨 -->
    <a-entity id="dose-label" visible="false"
              text="value: ; color: white; align: center; width: 4; side: double;"></a-entity>
</a-scene>

<script>
let fixedSourcePos = new THREE.Vector3();
let baseDoseRate = 0;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();

// 1. AR 모드 진입 (스마트폰의 실제 이동 추적을 위해 필수)
function enterAR() {
    const scene = document.querySelector('a-scene');
    if (scene.is('ar-mode')) {
        alert("이미 AR 모드입니다.");
    } else {
        scene.enterVR(); // AR 모드로 진입
        document.getElementById('status').innerText = "AR 모드 진입 완료. 벽면을 조준하세요.";
    }
}

// 2. 타겟 고정 (카메라가 바라보는 방향 2m 앞 지점에 소스 생성)
function lockTarget() {
    baseDoseRate = parseFloat(document.getElementById('base-dose-input').value) || 0;
    const camera = document.getElementById('main-camera').object3D;
    
    // 카메라의 현재 위치와 방향을 기반으로 2m 앞 좌표 계산
    const forward = new THREE.Vector3(0, 0, -2);
    forward.applyQuaternion(camera.quaternion);
    
    fixedSourcePos.copy(camera.position).add(forward);

    // 시각적 마커 배치
    const marker = document.getElementById('target-marker');
    marker.object3D.position.copy(fixedSourcePos);
    marker.setAttribute('visible', true);

    const label = document.getElementById('dose-label');
    label.object3D.position.copy(fixedSourcePos.clone().add(new THREE.Vector3(0, 0.2, 0)));
    label.setAttribute('visible', true);

    targetLocked = true;
    document.getElementById('status').innerText = "타겟 고정됨. 움직이며 선량을 확인하세요.";
}

// 3. 실시간 업데이트 루프
function update() {
    if (targetLocked) {
        const camera = document.getElementById('main-camera').object3D;
        const now = performance.now();
        const dt = (now - lastFrameTime) / 3600000; // 시간 변화 (시간 단위)
        lastFrameTime = now;

        // 실제 카메라 좌표와 타겟 사이의 거리 계산
        const dist = camera.position.distanceTo(fixedSourcePos);
        const safeDist = Math.max(dist, 0.1); // 최소 거리 10cm 제한
        
        // 역자승 법칙 적용 (기준 거리 1m 설정)
        const currentDoseRate = baseDoseRate * (1 / Math.pow(safeDist, 2));
        
        // 누적 피폭량 계산
        cumulativeDose += currentDoseRate * dt;

        // UI 갱신
        document.getElementById('dose-rate').innerText = currentDoseRate.toFixed(2);
        document.getElementById('distance').innerText = `거리: ${dist.toFixed(2)} m`;
        document.getElementById('cumulative-dose').innerText = `누적 피폭량: ${cumulativeDose.toFixed(6)} mSv`;

        // 선량별 색상 변경
        const doseEl = document.getElementById('dose-rate');
        if (currentDoseRate > 10) doseEl.style.color = '#ff3c3c';
        else if (currentDoseRate > 2) doseEl.style.color = '#ffaa00';
        else doseEl.style.color = '#00ff00';

        // 라벨이 항상 카메라를 바라보게 설정
        const label = document.getElementById('dose-label');
        label.object3D.lookAt(camera.position);
        label.setAttribute('text', `value: ${currentDoseRate.toFixed(1)} mSv/hr; align: center; width: 4;`);
    }
    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
