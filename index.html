# Radiation AR - Camera Fixed + Surface Target Version

```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR - Camera Fixed</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: sans-serif;
        }

        #camera-feed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
        }

        #ui-header {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0,0,0,0.82);
            border: 1px solid #00f2ff;
            border-radius: 14px;
            padding: 14px;
            color: white;
            text-align: center;
            z-index: 1001;
        }

        .main-dose {
            font-size: 30px;
            font-weight: bold;
            color: #00ff00;
        }

        #control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(20,20,20,0.92);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1002;
        }

        input, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        input {
            background: #333;
            color: white;
            text-align: center;
        }

        button {
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

<video id="camera-feed" autoplay playsinline muted></video>
<div id="crosshair"></div>

<div id="ui-header">
    <div id="status">1. 카메라 시작 → 2. 타겟 지정</div>
    <div class="main-dose"><span id="dose-rate">0.00</span> mSv/hr</div>
    <div id="distance">거리: 0.00 m</div>
    <div id="target-dose">기준 선량: 0.00 mSv/hr</div>
    <div id="cumulative-dose">누적 피폭량: 0.000000 mSv</div>
</div>

<div id="control-panel">
    <input type="number" id="base-dose-input" value="10" step="0.1" min="0">
    <button onclick="startCamera()" style="background:#007bff;">1. 카메라 시작</button>
    <button onclick="lockTarget()" style="background:#28a745;">2. 타겟 지정</button>
    <button onclick="location.reload()" style="background:#444;">초기화</button>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-camera id="main-camera" position="0 1.6 0" look-controls></a-camera>

    <a-sphere id="target-marker"
              radius="0.25"
              color="red"
              visible="false"
              material="shader: standard; emissive: red; emissiveIntensity: 2;">
    </a-sphere>

    <a-entity id="dose-label"
              visible="false"
              text="value: ; color: white; align: center; width: 6; side: double;">
    </a-entity>
</a-scene>

<script>
let fixedSourcePos = new THREE.Vector3();
let baseDoseRate = 0;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let measurementStartTime = null;

async function startCamera() {
    try {
        const video = document.getElementById('camera-feed');

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: 'environment' }
            },
            audio: false
        });

        video.srcObject = stream;

        if (
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
            await DeviceOrientationEvent.requestPermission();
        }

        document.getElementById('status').innerText = '카메라 활성화 완료. 타겟을 조준하세요.';
    } catch (err) {
        alert('카메라 실행 실패: HTTPS 또는 권한 허용 필요');
        console.error(err);
    }
}

function lockTarget() {
    const camera = document.getElementById('main-camera').object3D;

    baseDoseRate = parseFloat(document.getElementById('base-dose-input').value) || 0;

    const forward = new THREE.Vector3(0, 0, -2);
    forward.applyQuaternion(camera.quaternion);

    // 사용자가 조준한 방향 기준 약 2m 위치에 고정
    fixedSourcePos.copy(camera.position).add(forward);

    const marker = document.getElementById('target-marker');
    marker.object3D.position.copy(fixedSourcePos);
    marker.setAttribute('visible', true);

    const label = document.getElementById('dose-label');
    label.object3D.position.copy(
        fixedSourcePos.clone().add(new THREE.Vector3(0, 0.35, 0))
    );
    label.setAttribute(
        'text',
        `value: ${baseDoseRate.toFixed(1)} mSv/hr; color: white; align: center; width: 6; side: double;`
    );
    label.setAttribute('visible', true);

    cumulativeDose = 0;
    lastFrameTime = performance.now();
    measurementStartTime = performance.now();
    targetLocked = true;

    document.getElementById('target-dose').innerText = `기준 선량: ${baseDoseRate.toFixed(2)} mSv/hr`;
    document.getElementById('status').innerText = '타겟 고정 완료. 이동하며 거리 측정 중';
}

function update() {
    if (targetLocked) {
        const camera = document.getElementById('main-camera').object3D;
        const label = document.getElementById('dose-label');

        const now = performance.now();
        const dtHours = (now - lastFrameTime) / 3600000;
        lastFrameTime = now;

        let dist = camera.position.distanceTo(fixedSourcePos);
        dist = Math.max(0.5, Math.min(dist, 10));

        const referenceDistance = 0.5;
        const currentDoseRate = baseDoseRate * Math.pow(referenceDistance / dist, 2);

        cumulativeDose += currentDoseRate * dtHours;

        document.getElementById('dose-rate').innerText = currentDoseRate.toFixed(2);
        document.getElementById('distance').innerText = `거리: ${dist.toFixed(2)} m`;
        document.getElementById('cumulative-dose').innerText = `누적 피폭량: ${cumulativeDose.toFixed(6)} mSv`;

        label.object3D.lookAt(camera.position);

        const doseEl = document.getElementById('dose-rate');
        if (currentDoseRate > 15) {
            doseEl.style.color = '#ff3c3c';
        } else if (currentDoseRate > 5) {
            doseEl.style.color = '#ffaa00';
        } else {
            doseEl.style.color = '#00ff00';
        }
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
```
