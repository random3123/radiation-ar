# Radiation AR - Wall Surface Target Lock Version

```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation AR Wall Target</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: sans-serif;
        }

        #crosshair {
            position: fixed;

            text-align: center;
            border: 1px solid #555;
        }

            font-weight: bold;

        }
    </style>

<body>

<div id="crosshair"></div>

<div id="ui-header">
    <div id="status">센서 시작 후 벽면 중앙 조준</div>
    <div>현재 선량률</div>
    <div class="main-dose"><span id="dose-rate">0.00</span> mSv/hr</div>
    <div id="distance">거리: 0.00 m</div>
    <div id="target-dose">기준 선량: 0.00 mSv/hr</div>
    <div id="cumulative-dose">누적 피폭량: 0.0000 mSv</div>
    <div id="elapsed-time">경과 시간: 0 초</div>
</div>

<div id="control-panel">
    <input type="number" id="base-dose-input" value="10" min="0" step="0.1" placeholder="기준 선량률">
    <button onclick="initSensors()" style="background:#007bff;color:white;">1. 센서 시작</button>
    <button onclick="lockWallTarget()" style="background:#28a745;color:white;">2. 벽면 타겟 지정</button>
    <button onclick="location.reload()" style="background:#444;color:white;">초기화</button>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true" arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-entity id="rig" position="0 1.6 0">
        <a-camera id="main-camera"></a-camera>
    </a-entity>

    <a-sphere id="target-marker"
        radius="0.25"
        color="red"
        visible="false"
        material="shader: standard; emissive: red; emissiveIntensity: 2;">
    </a-sphere>

    <a-entity id="dose-label"
        visible="false"
        text="value: ; color: white; align: center; width: 6; side: double;">
    </a-entity>

</a-scene>

<script>
let fixedSourcePos = new THREE.Vector3();
let estimatedUserPos = new THREE.Vector3(0, 1.6, 0);
let velocity = new THREE.Vector3(0, 0, 0);
let motionActive = false;
let lastMotionTime = null;

let baseDoseRate = 0;
let targetLocked = false;
let cumulativeDose = 0;
let measurementStartTime = null;
let lastFrameTime = null;
let currentDistance = 0;

async function initSensors() {
    try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            const permission = await DeviceMotionEvent.requestPermission();
            if (permission !== 'granted') {
                alert('모션 센서 권한 필요');
                return;
            }
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
        }

        window.addEventListener('devicemotion', handleMotion, true);
        motionActive = true;

        document.getElementById('status').innerText = '센서 활성화 완료. 벽면을 조준하세요';
    } catch (err) {
        alert('센서 초기화 실패');
    }
}

function handleMotion(event) {
    if (!motionActive || !targetLocked) return;

    const acc = event.acceleration;
    if (!acc) return;

    const now = performance.now();
    if (!lastMotionTime) {
        lastMotionTime = now;
        return;
    }

    const dt = (now - lastMotionTime) / 1000;
    lastMotionTime = now;

    if (dt <= 0 || dt > 0.1) return;

    const cam = document.getElementById('main-camera').object3D;

    let accVector = new THREE.Vector3(
        acc.x || 0,
        acc.y || 0,
        acc.z || 0
    );

    if (accVector.length() < 0.05) {
        velocity.set(0,0,0);
        return;
    }

    accVector.applyQuaternion(cam.quaternion);

    velocity.add(accVector.multiplyScalar(dt));
    velocity.multiplyScalar(0.78);

    if (velocity.length() < 0.003) {
        velocity.set(0,0,0);
        return;
    }

    estimatedUserPos.add(
        velocity.clone().multiplyScalar(dt)
    );

    cam.position.copy(estimatedUserPos);

    currentDistance = cam.position.distanceTo(fixedSourcePos);
    currentDistance = Math.max(0.5, Math.min(currentDistance, 10));
}

function lockWallTarget() {
    baseDoseRate = parseFloat(document.getElementById('base-dose-input').value) || 0;

    const cam = document.getElementById('main-camera').object3D;

    const forward = new THREE.Vector3();
    cam.getWorldDirection(forward);

    // 벽면 타겟: 조준 방향 2m 전방 고정
    const wallDistance = 2.0;
    fixedSourcePos.copy(cam.position).add(
        forward.normalize().multiplyScalar(wallDistance)
    );

    const marker = document.getElementById('target-marker');
    marker.object3D.position.copy(fixedSourcePos);
    marker.setAttribute('visible', true);

    const label = document.getElementById('dose-label');
    label.object3D.position.copy(
        fixedSourcePos.clone().add(new THREE.Vector3(0, 0.35, 0))
    );
    label.setAttribute(
        'text',
        `value: ${baseDoseRate.toFixed(1)} mSv/hr; color: white; align: center; width: 6; side: double;`
    );
    label.setAttribute('visible', true);

    currentDistance = wallDistance;
    cumulativeDose = 0;
    measurementStartTime = performance.now();
    lastFrameTime = performance.now();
    targetLocked = true;

    document.getElementById('target-dose').innerText = `기준 선량: ${baseDoseRate.toFixed(2)} mSv/hr`;
    document.getElementById('status').innerText = '벽면 타겟 측정 중';
}

function updateSimulation() {
    if (targetLocked) {
        const now = performance.now();
        const deltaHours = (now - lastFrameTime) / 3600000;
        lastFrameTime = now;

        const safeDistance = Math.max(currentDistance, 0.5);
        const referenceDistance = 0.5;

        const currentDoseRate = baseDoseRate * Math.pow(referenceDistance / safeDistance, 2);

        cumulativeDose += currentDoseRate * deltaHours;

        document.getElementById('dose-rate').innerText = currentDoseRate.toFixed(2);
        document.getElementById('distance').innerText = `거리: ${currentDistance.toFixed(2)} m`;
        document.getElementById('cumulative-dose').innerText = `누적 피폭량: ${cumulativeDose.toFixed(4)} mSv`;

        const elapsedSec = Math.floor((now - measurementStartTime) / 1000);
        document.getElementById('elapsed-time').innerText = `경과 시간: ${elapsedSec} 초`;

        const cam = document.getElementById('main-camera').object3D;
        const label = document.getElementById('dose-label');
        label.object3D.lookAt(cam.position);

        const doseEl = document.getElementById('dose-rate');
        if (currentDoseRate > 15) {
            doseEl.style.color = '#ff3c3c';
        } else if (currentDoseRate > 5) {
            doseEl.style.color = '#ffaa00';
        } else {
            doseEl.style.color = '#00ff00';
        }
    }

    requestAnimationFrame(updateSimulation);
}

updateSimulation();
</script>

</body>
</html>
