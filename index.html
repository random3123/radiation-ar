<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radiation GPS AR Tracker - Pro</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #camera-feed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.7; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.3); }
        .hazard-glow { text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
        #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid rgba(56, 189, 248, 0.5); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .critical-pulse { animation: pulse-red 1s infinite; }
    </style>
</head>
<body class="text-slate-100">

<video id="camera-feed" autoplay playsinline muted></video>
<div id="crosshair"></div>

<div id="ui-header" class="fixed top-4 left-1/2 -translate-x-1/2 w-[94%] max-w-lg glass rounded-2xl p-4 z-[1001]">
    <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] text-sky-400 font-bold tracking-widest uppercase">GPS Dosimeter Simulator v5.0</span>
        <div id="gps-status" class="flex items-center gap-1.5">
            <span id="accuracy-text" class="text-[9px] text-slate-400">GPS Waiting...</span>
            <div id="status-light" class="w-2 h-2 rounded-full bg-slate-500"></div>
        </div>
    </div>
    
    <div class="text-center py-1">
        <div class="text-[11px] text-slate-400 uppercase mb-1">Current Dose Rate</div>
        <div id="dose-display" class="font-orbitron text-5xl font-bold text-green-400 transition-all">0.00 <span class="text-lg font-normal">mSv/h</span></div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-700 pt-3">
        <div class="text-center">
            <div class="text-[9px] text-slate-500 uppercase">Distance (GPS)</div>
            <div id="dist-text" class="font-orbitron text-xl text-sky-300">0.00 m</div>
        </div>
        <div class="text-center border-l border-slate-700">
            <div class="text-[9px] text-slate-500 uppercase">Cumulative Exposure</div>
            <div id="cum-text" class="font-orbitron text-xl text-amber-400">0.000000</div>
        </div>
    </div>
</div>

<div id="control-panel" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[94%] max-w-lg z-[1002] flex flex-col gap-3">
    <div class="glass p-4 rounded-2xl shadow-2xl">
        <div class="flex flex-col gap-3">
            <div>
                <label class="text-[10px] text-slate-400 uppercase font-bold ml-1">Source Intensity (at 1m)</label>
                <div class="relative mt-1">
                    <input type="number" id="base-dose-input" value="50" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 px-4 text-white text-xl font-orbitron focus:ring-2 focus:ring-sky-500 outline-none">
                    <span class="absolute right-4 top-3.5 text-slate-500 font-bold">mSv/h</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button id="sensor-btn" onclick="initSensors()" class="bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold flex flex-col items-center justify-center border border-slate-600 transition-all active:scale-95">
                    <span class="text-[10px] text-sky-400 uppercase">Step 1</span>
                    <span>Enable Sensors</span>
                </button>
                <button id="deploy-btn" onclick="deployTarget()" disabled class="bg-sky-600 opacity-50 hover:bg-sky-500 py-4 rounded-xl font-bold flex flex-col items-center justify-center shadow-lg transition-all active:scale-95">
                    <span class="text-[10px] text-white/70 uppercase">Step 2</span>
                    <span>Deploy Source</span>
                </button>
            </div>

            <button onclick="resetSystem()" class="w-full bg-rose-900/40 hover:bg-rose-800/60 border border-rose-500/50 py-3 rounded-xl font-bold text-rose-200 transition-all active:scale-95 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                SYSTEM RESET
            </button>
        </div>
    </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-camera id="main-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-camera>

    <a-entity id="radiation-source" visible="false">
        <a-sphere radius="0.3" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 3;">
            <a-animation attribute="scale" from="1 1 1" to="1.3 1.3 1.3" dur="800" direction="alternate" repeat="indefinite"></a-animation>
        </a-sphere>
        <a-ring radius-inner="0.6" radius-outer="0.65" rotation="-90 0 0" color="#ff0000" opacity="0.6"></a-ring>
        <a-text value="DANGER: SOURCE" align="center" position="0 0.7 0" scale="1.5 1.5 1.5" font="monoid"></a-text>
    </a-entity>
</a-scene>

<script>
let targetGps = null;
let currentGps = null;
let baseDoseAt1m = 50;
let targetLocked = false;
let cumulativeDose = 0;
let lastFrameTime = performance.now();
let watchId = null;

const synth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.015, sustain: 0 }
}).toDestination();

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

async function initSensors() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        document.getElementById('camera-feed').srcObject = stream;
        await Tone.start();

        if ("geolocation" in navigator) {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentGps = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    document.getElementById('accuracy-text').innerText = `Acc: ±${pos.coords.accuracy.toFixed(1)}m`;
                    document.getElementById('status-light').className = "w-2 h-2 rounded-full bg-green-500";
                    document.getElementById('deploy-btn').disabled = false;
                    document.getElementById('deploy-btn').style.opacity = "1";
                },
                (err) => showToast("GPS Error: " + err.message),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
            showToast("Sensors Initialized");
        }
    } catch (err) {
        showToast("Permission Denied");
    }
}

function deployTarget() {
    if (!currentGps) {
        showToast("Waiting for GPS signal...");
        return;
    }

    const camera = document.getElementById('main-camera').object3D;
    const sourceEl = document.getElementById('radiation-source');
    
    targetGps = { ...currentGps };
    baseDoseAt1m = parseFloat(document.getElementById('base-dose-input').value) || 50;

    const forward = new THREE.Vector3(0, 0, -3);
    forward.applyQuaternion(camera.quaternion);
    sourceEl.object3D.position.copy(camera.position).add(forward);
    
    sourceEl.setAttribute('visible', 'true');
    targetLocked = true;
    cumulativeDose = 0;
    
    document.getElementById('status-light').classList.add('animate-pulse');
    showToast("Source Fixed at Coordinates");
}

function resetSystem() {
    // 1. 상태 변수 초기화
    targetLocked = false;
    targetGps = null;
    cumulativeDose = 0;
    
    // 2. UI 초기화
    document.getElementById('dose-display').innerHTML = `0.00 <span class="text-lg font-normal">mSv/h</span>`;
    document.getElementById('dose-display').className = "font-orbitron text-5xl font-bold text-green-400 transition-all";
    document.getElementById('dist-text').innerText = "0.00 m";
    document.getElementById('cum-text').innerText = "0.000000";
    document.getElementById('status-light').classList.remove('animate-pulse');
    
    // 3. 3D 오브젝트 숨기기
    document.getElementById('radiation-source').setAttribute('visible', 'false');
    
    showToast("System Reset Complete");
    
    // 페이지를 새로고침하여 센서 및 메모리 완전히 비우고 싶다면 아래 주석 해제
    // location.reload();
}

let nextTickTime = 0;
function update() {
    const now = performance.now();
    const dtHours = (now - lastFrameTime) / 3600000;
    lastFrameTime = now;

    if (targetLocked && currentGps && targetGps) {
        let dist = getDistanceInMeters(currentGps.lat, currentGps.lon, targetGps.lat, targetGps.lon);
        dist = Math.max(0.5, dist);

        const currentDoseRate = baseDoseAt1m * Math.pow(1 / dist, 2);
        cumulativeDose += currentDoseRate * dtHours;

        const doseDisp = document.getElementById('dose-display');
        document.getElementById('dist-text').innerText = `${dist.toFixed(2)} m`;
        document.getElementById('cum-text').innerText = cumulativeDose.toFixed(6);
        doseDisp.innerHTML = `${currentDoseRate.toFixed(2)} <span class="text-lg font-normal">mSv/h</span>`;

        if (currentDoseRate > 100) {
            doseDisp.className = "font-orbitron text-5xl font-bold text-red-500 hazard-glow animate-pulse";
        } else if (currentDoseRate > 20) {
            doseDisp.className = "font-orbitron text-5xl font-bold text-yellow-400";
        } else {
            doseDisp.className = "font-orbitron text-5xl font-bold text-green-400";
        }

        const tickInterval = Math.max(15, 1000 / (currentDoseRate * 0.4 + 1));
        if (now > nextTickTime) {
            synth.triggerAttackRelease("16n");
            nextTickTime = now + tickInterval;
        }

        const sourceEl = document.getElementById('radiation-source');
        sourceEl.object3D.lookAt(document.getElementById('main-camera').object3D.position);
    }
    requestAnimationFrame(update);
}

function showToast(m) {
    const t = document.createElement('div');
    t.className = "fixed bottom-44 left-1/2 -translate-x-1/2 bg-sky-950/90 text-white px-5 py-2.5 rounded-full z-[3000] border border-sky-500 text-xs font-bold shadow-2xl";
    t.innerText = m;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

window.onload = () => update();
</script>
</body>
</html>
