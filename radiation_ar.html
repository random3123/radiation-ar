<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>방사선 안전 교육용 AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui-container {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-family: sans-serif;
            z-index: 1000;
            border: 2px solid #ffcc00;
            pointer-events: none; /* 카메라 화면 터치 방해 금지 */
        }
        .label { font-size: 14px; color: #ccc; margin: 2px 0; }
        .value { font-size: 28px; font-weight: bold; color: #00ff00; }
        .warning { color: #ff3333 !important; }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="ui-container">
        <div id="qr-id" class="label">마커를 비춰주세요</div>
        <div id="distance" class="label">거리: - m</div>
        <div id="dose-rate" class="value">0.00 mSv/hr</div>
    </div>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-marker type="barcode" value="1" id="m1" data-i0="10" data-d0="0.5">
            <a-box position="0 0.5 0" material="opacity: 0.5; color: red;" scale="0.2 0.2 0.2"></a-box>
        </a-marker>

        <a-marker type="barcode" value="2" id="m2" data-i0="5" data-d0="0.5">
            <a-box position="0 0.5 0" material="opacity: 0.5; color: yellow;" scale="0.2 0.2 0.2"></a-box>
        </a-marker>

        <a-marker type="barcode" value="3" id="m3" data-i0="3" data-d0="0.5">
            <a-box position="0 0.5 0" material="opacity: 0.5; color: green;" scale="0.2 0.2 0.2"></a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const uiDose = document.getElementById('dose-rate');
        const uiDist = document.getElementById('distance');
        const uiId = document.getElementById('qr-id');
        
        // 거리 역자승 법칙 계산 함수
        function calculateDose(i0, d0, d) {
            if (d < 0.2) d = 0.2; // 너무 가까울 때 인식 불안정 방지
            return i0 * Math.pow((d0 / d), 2);
        }

        const markers = document.querySelectorAll('a-marker');

        setInterval(() => {
            let anyVisible = false;

            markers.forEach(marker => {
                if (marker.object3D.visible) {
                    anyVisible = true;
                    
                    // 카메라와 마커 사이의 좌표 거리 계산
                    let pos = marker.object3D.position;
                    let d = Math.sqrt(pos.x**2 + pos.y**2 + pos.z**2);
                    
                    // A4 사이즈(21cm) 마커 기준 거리 보정값 (실제 환경에 맞춰 미세조정 가능)
                    let actualDistance = d * 0.25; 

                    let i0 = parseFloat(marker.getAttribute('data-i0'));
                    let d0 = parseFloat(marker.getAttribute('data-d0'));
                    let currentDose = calculateDose(i0, d0, actualDistance);

                    // UI 업데이트
                    uiId.innerText = "인식됨: 선원 #" + marker.getAttribute('value');
                    uiDist.innerText = "거리: " + actualDistance.toFixed(2) + " m";
                    uiDose.innerText = currentDose.toFixed(2) + " mSv/hr";

                    // 선량률에 따른 색상 변경
                    if (currentDose >= 5) {
                        uiDose.className = "value warning";
                    } else {
                        uiDose.className = "value";
                    }
                }
            });

            if (!anyVisible) {
                uiId.innerText = "마커를 찾는 중...";
                uiDist.innerText = "거리: - m";
            }
        }, 100);
    </script>
</body>
</html>
